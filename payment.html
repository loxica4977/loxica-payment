<!DOCTYPE html>
<html>
<head>

<title>LOXICA Secure Payment</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f5f5f5;
margin:0;
padding:15px 0;
display:flex;
justify-content:center;
}

.container{
width:100%;
max-width:430px;
background:#111;
color:white;
padding:25px;
border-radius:18px;
box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.logo{
text-align:center;
font-size:32px;
font-weight:bold;
letter-spacing:1px;
}

h3{
text-align:center;
margin:15px 0;
}

#product{
text-align:center;
font-size:22px;
font-weight:bold;
margin-top:20px;
}

.price{
text-align:center;
font-size:30px;
font-weight:bold;
color:#2ecc71;
margin:10px 0 20px;
}

p{
text-align:center;
color:#ccc;
}

button{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:10px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

button:first-of-type{
background:#2ecc71;
color:#111;
}

#paid{
display:none;
background:#00a651;
color:white;
}

button:hover{
opacity:.9;
}

@media(max-width:450px){

.container{
padding:22px 18px;
}

.logo{
font-size:30px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="logo">LOXICA</div>

<h3>🔒 Secure Payment</h3>

<h2 id="product">Product Name</h2>

<div class="price" id="price">₹0</div>

<h3>Pay Using UPI</h3>

<p>Click below to continue payment</p>

<button id="payBtn" onclick="payNow()">Pay Now 💳</button>

<button id="paid" onclick="orderSuccess()">
I Have Paid ✅
</button>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const product = params.get("product") || "Product Name";
const price = params.get("price") || "0";

document.getElementById("product").innerText = product;
document.getElementById("price").innerText = "₹" + price;

function payNow(){

const payBtn = document.getElementById("payBtn");

payBtn.disabled = true;
payBtn.innerText = "Opening UPI...";

let upiID = "8714917161@fam";

let upiLink =
"upi://pay?pa=" + upiID +
"&pn=LOXICA" +
"&am=" + price +
"&cu=INR" +
"&tn=" + encodeURIComponent(product);

window.location.href = upiLink;

}

window.addEventListener("focus",()=>{

document.getElementById("paid").style.display="block";

});

function orderSuccess(){

window.location.href="thankyou.html";

}

</script>

</body>
</html>
