<!DOCTYPE html>
<html>
<head>
<title>LOXICA Secure Payment</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
margin:0;
padding:20px 0 0;
background:#f5f5f5;
font-family:Arial,Helvetica,sans-serif;
display:flex;
flex-direction:column;
align-items:center;
min-height:100vh;
}


.container{
width:100%;
max-width:430px;
min-height:100vh;
background:#111;
color:white;
padding:35px 25px;
border-radius:18px 18px 0 0;
box-shadow:0 10px 30px rgba(0,0,0,.15);
}
.logo{
text-align:center;
font-size:42px;
font-weight:900;
letter-spacing:3px;
margin-bottom:20px;
}

h3{
text-align:center;
}

#product{
text-align:center;
font-size:28px;
margin-top:35px;
}
.price{
text-align:center;
font-size:40px;
font-weight:bold;
color:#2ecc71;
margin:20px 0 35px;
}

.secure{

background:#1b1b1b;
padding:12px;
border-radius:12px;
text-align:center;
color:#2ecc71;

}


p{
text-align:center;
color:#ccc;
}


button{
width:100%;
padding:20px;
margin-top:20px;
border-radius:15px;
font-size:20px;
font-weight:bold;
}


button:first-of-type{

background:#2ecc71;
color:#111;

}


#paid{

background:#00a651;
color:white;

}


button:hover{

opacity:0.9;

}


@media(max-width:450px){

body{
padding:15px;
}

.container{
padding:25px 18px;
}

.logo{
font-size:32px;
}

}

</style>
</head>

<body>

<div class="container">

<div class="logo">LOXICA</div>

<h3>🔒 Secure Payment</h3>

<h2 id="product">Product Name</h2>

<div class="price" id="price">₹0</div>

<h3>Pay Using UPI</h3>

<p>Click below to continue payment</p>
<button onclick="payNow()">Continue to Pay</button>

<button id="paid" onclick="orderSuccess()" style="display:none;background:green;">
I Have Paid ✅
</button>

</div>


<script>

const params = new URLSearchParams(window.location.search);

const product = params.get("product") || "Product Name";
const price = params.get("price") || "0";

document.getElementById("product").innerText = product;
document.getElementById("price").innerText = "₹" + price;


function payNow(){

let upiID = "8714917161@fam";

let upiLink =
"upi://pay?pa=" + upiID +
"&pn=LOXICA" +
"&am=" + price +
"&cu=INR" +
"&tn=" + product;

window.location.href = upiLink;

}


function orderSuccess(){

window.location.href="thankyou.html";

}

</script>


</body>
</html>
