<!DOCTYPE html>
<html>
<head>
<title>LOXICA Secure Payment</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
margin:0;
padding:20px;
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{

width:100%;
max-width:420px;
background:#111;
color:white;
padding:30px 25px;
border-radius:22px;
box-shadow:0 15px 35px rgba(0,0,0,0.25);
}

.logo{
text-align:center;
font-size:36px;
font-weight:800;
letter-spacing:2px;
color:white;
margin-bottom:10px;
}

h3{
text-align:center;
}

#product{
text-align:center;
font-size:22px;
margin-top:25px;
}

.price{

text-align:center;
font-size:32px;
font-weight:bold;
color:#2ecc71;
margin:15px 0 25px;

}

.secure{

background:#1b1b1b;
padding:12px;
border-radius:12px;
text-align:center;
color:#2ecc71;

}


p{
text-align:center;
color:#ccc;
}


button{

width:100%;
padding:16px;
margin-top:15px;
border:none;
border-radius:12px;
font-size:17px;
font-weight:bold;
cursor:pointer;

}


button:first-of-type{

background:#2ecc71;
color:#111;

}


#paid{

background:#00a651;
color:white;

}


button:hover{

opacity:0.9;

}


@media(max-width:450px){

body{
padding:15px;
}

.container{
padding:25px 18px;
}

.logo{
font-size:32px;
}

}

</style>
</head>

<body>

<div class="container">

<div class="logo">LOXICA</div>

<h3>🔒 Secure Payment</h3>

<h2 id="product">Product Name</h2>

<div class="price" id="price">₹0</div>

<h3>Pay Using UPI</h3>

<p>Click below to continue payment</p>
<button onclick="payNow()">Continue to Pay</button>

<button id="paid" onclick="orderSuccess()" style="display:none;background:green;">
I Have Paid ✅
</button>

</div>


<script>

const params = new URLSearchParams(window.location.search);

const product = params.get("product") || "Product Name";
const price = params.get("price") || "0";

document.getElementById("product").innerText = product;
document.getElementById("price").innerText = "₹" + price;


function payNow(){

let upiID = "8714917161@fam";

let upiLink =
"upi://pay?pa=" + upiID +
"&pn=LOXICA" +
"&am=" + price +
"&cu=INR" +
"&tn=" + product;

window.location.href = upiLink;

}


function orderSuccess(){

window.location.href="thankyou.html";

}

</script>


</body>
</html>
