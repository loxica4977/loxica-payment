<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LOXICA Cart</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f5f5f5;
    color:#111;
}

.container{
    max-width:1100px;
    margin:0 auto;
    padding:30px 20px;
}

h1{
    font-size:28px;
    margin-bottom:25px;
}

.cart-box{
    background:#fff;
    border-radius:12px;
    padding:25px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.empty{
    text-align:center;
    padding:50px 20px;
    color:#777;
}

button{
    border:none;
    cursor:pointer;
}

</style>
</head>

<body>

<div class="container">

    <h1>My Cart</h1>

    <div class="cart-box">

        <div class="empty">
            <h2>Your cart is empty</h2>
            <p>Add products to your cart to see them here.</p>
        </div>

    </div>

</div>

</body>
</html>
