
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LOXICA - My Orders</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f5f5f5;
    color:#111;
}

/* =========================
   HEADER
========================= */

.header{
    width:100%;
    background:#111;
    color:white;
    height:64px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.logo{
    font-size:29px;
    font-weight:800;
    letter-spacing:1.5px;
}

.back-btn{
    position:absolute;
    right:22px;
    color:white;
    text-decoration:none;
    font-size:14px;
    font-weight:600;
    border:1px solid #444;
    padding:9px 14px;
    border-radius:6px;
}

.back-btn:hover{
    background:#222;
}

/* =========================
   PAGE
========================= */

.container{
    width:100%;
    max-width:900px;
    margin:28px auto;
    padding:0 16px;
}

.page-title{
    font-size:25px;
    font-weight:700;
    margin-bottom:18px;
}

/* =========================
   LOADING
========================= */

.loading{
    text-align:center;
    padding:50px 20px;
    color:#666;
    font-size:15px;
}

.spinner{
    width:32px;
    height:32px;
    border:3px solid #ddd;
    border-top:3px solid #111;
    border-radius:50%;
    margin:0 auto 14px;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================
   ERROR
========================= */

.error-box{
    background:white;
    border:1px solid #ddd;
    border-radius:8px;
    padding:25px;
    text-align:center;
    color:#555;
}

/* =========================
   ORDER CARD
========================= */

.order-card{
    background:white;
    border:1px solid #ddd;
    border-radius:8px;
    margin-bottom:14px;
    overflow:hidden;
    transition:.2s;
}

.order-card:hover{
    border-color:#aaa;
}

/* =========================
   ORDER SUMMARY
========================= */

.order-summary{
    min-height:120px;
    display:flex;
    align-items:center;
    padding:15px;
    cursor:pointer;
    gap:18px;
}

/* =========================
   PRODUCT IMAGE BOX
========================= */

.product-image-box{
    width:105px;
    height:105px;
    flex-shrink:0;
    border-radius:7px;
    background:#f7f7f7;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border:1px solid #eee;
}

.product-image{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

/* =========================
   SUMMARY CONTENT
========================= */

.summary-content{
    flex:1;
    min-width:0;
}

.product-name{
    font-size:17px;
    font-weight:700;
    color:#111;
    margin-bottom:9px;
    line-height:1.3;
}

.price{
    font-size:16px;
    font-weight:700;
    margin-bottom:8px;
}

.summary-bottom{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

/* =========================
   STATUS
========================= */

.status{
    display:inline-block;
    font-size:12px;
    font-weight:700;
    padding:5px 9px;
    border-radius:5px;
    background:#eee;
    color:#555;
}

.status.paid{
    background:#e8f7df;
    color:#287a16;
}

.status.pending{
    background:#fff3cd;
    color:#856404;
}

.status.cancelled{
    background:#fde2e2;
    color:#b42318;
}

.status.shipped{
    background:#e5f0ff;
    color:#1457a6;
}

.status.delivered{
    background:#e8f7df;
    color:#287a16;
}

/* =========================
   ARROW
========================= */

.expand-icon{
    width:30px;
    height:30px;
    flex-shrink:0;
    border-radius:50%;
    background:#f2f2f2;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    transition:.2s;
}

.order-card.open .expand-icon{
    transform:rotate(180deg);
}

/* =========================
   DETAILS
========================= */

.order-details{
    display:none;
    border-top:1px solid #eee;
    padding:18px 20px 20px;
    background:#fafafa;
}

.order-card.open .order-details{
    display:block;
}

.details-title{
    font-size:14px;
    font-weight:700;
    margin-bottom:14px;
}

.detail-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.detail-box{
    background:white;
    border:1px solid #eee;
    border-radius:6px;
    padding:11px 12px;
}

.detail-label{
    font-size:11px;
    color:#777;
    margin-bottom:4px;
}

.detail-value{
    font-size:14px;
    font-weight:600;
    color:#111;
    word-break:break-word;
}

/* =========================
   TRACKING
========================= */

.tracking-box{
    margin-top:12px;
    background:white;
    border:1px solid #ddd;
    border-radius:7px;
    padding:14px;
}

.tracking-header{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
}

.tracking-icon{
    font-size:18px;
}

.tracking-title{
    font-size:14px;
    font-weight:700;
}

.tracking-id{
    font-size:16px;
    font-weight:800;
    letter-spacing:.4px;
    word-break:break-word;
}

.tracking-note{
    margin-top:5px;
    font-size:11px;
    color:#777;
}

/* =========================
   TOTAL
========================= */

.total-box{
    margin-top:12px;
    background:white;
    border:1px solid #ddd;
    border-radius:6px;
    padding:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.total-label{
    font-size:14px;
    font-weight:600;
}

.total-value{
    font-size:18px;
    font-weight:800;
}

/* =========================
   EMPTY
========================= */

.empty{
    background:white;
    border:1px solid #ddd;
    border-radius:8px;
    padding:45px 20px;
    text-align:center;
}

.empty-title{
    font-size:20px;
    font-weight:700;
    margin-bottom:8px;
}

.empty-text{
    color:#777;
    font-size:14px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .header{
        height:60px;
    }

    .logo{
        font-size:27px;
    }

    .back-btn{
        right:10px;
        padding:7px 9px;
        font-size:12px;
    }

    .container{
        margin:20px auto;
        padding:0 10px;
    }

    .page-title{
        font-size:22px;
        margin-bottom:14px;
    }

    .order-summary{
        min-height:100px;
        padding:11px;
        gap:12px;
    }

    .product-image-box{
        width:82px;
        height:82px;
    }

    .product-name{
        font-size:15px;
        margin-bottom:6px;
    }

    .price{
        font-size:15px;
        margin-bottom:5px;
    }

    .status{
        font-size:10px;
        padding:4px 7px;
    }

    .expand-icon{
        width:26px;
        height:26px;
        font-size:14px;
    }

    .order-details{
        padding:15px 12px;
    }

    .detail-grid{
        grid-template-columns:1fr;
    }

    .total-value{
        font-size:16px;
    }

    .tracking-id{
        font-size:15px;
    }

}

@media(max-width:380px){

    .back-btn{
        display:none;
    }

    .product-image-box{
        width:72px;
        height:72px;
    }

    .order-summary{
        gap:9px;
    }

}

</style>

</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="logo">
        LOXICA
    </div>

    <a
        href="https://loxicos.com"
        class="back-btn"
    >
        ← Back to Store
    </a>

</header>


<!-- =========================
     MAIN
========================= -->

<main class="container">

    <h1 class="page-title">
        My Orders
    </h1>


    <div
        id="loading"
        class="loading"
    >

        <div class="spinner"></div>

        Loading your orders...

    </div>


    <div
        id="ordersContainer"
        style="display:none;"
    ></div>

</main>


<script>

// =====================================================
// API
// =====================================================

const API_URL =
    "https://script.google.com/macros/s/AKfycbx61ZbcXj5ySQ0ovhGj-SjnKHpav818Gp4-uUcdBTfpsCd2ZU8B5TxuOWLKklvfnLKj/exec";


// =====================================================
// GET MEMBER ID
// =====================================================

const params =
    new URLSearchParams(
        window.location.search
    );

const memberId =
    (params.get("memberId") || "").trim();


// =====================================================
// ELEMENTS
// =====================================================

const loading =
    document.getElementById(
        "loading"
    );

const ordersContainer =
    document.getElementById(
        "ordersContainer"
    );


// =====================================================
// START
// =====================================================

loadOrders();


// =====================================================
// LOAD ORDERS
// =====================================================

async function loadOrders(){

    try{

        if(!memberId){

            showError(
                "Member ID is missing. Please login again."
            );

            return;
        }


        const requestURL =
            API_URL +
            "?memberId=" +
            encodeURIComponent(
                memberId
            );


        const response =
            await fetch(
                requestURL,
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        const text =
            await response.text();


        let data;


        try{

            data =
                JSON.parse(text);

        }catch(error){

            console.error(
                "Invalid API response:",
                text
            );

            showError(
                "Unable to load orders."
            );

            return;
        }


        if(
            !data ||
            data.success !== true
        ){

            showError(
                data &&
                data.error
                    ? data.error
                    : "Unable to load orders."
            );

            return;
        }


        const orders =
            Array.isArray(
                data.orders
            )
                ? data.orders
                : [];


        // =================================================
        // NEWEST ORDER FIRST
        // =================================================

        orders.sort(function(a,b){

            const dateA =
                new Date(
                    a.date || 0
                ).getTime();

            const dateB =
                new Date(
                    b.date || 0
                ).getTime();

            return dateB - dateA;

        });


        renderOrders(
            orders
        );


    }catch(error){

        console.error(
            "MY ORDERS ERROR:",
            error
        );

        showError(
            "Something went wrong while loading your orders."
        );

    }

}


// =====================================================
// RENDER ORDERS
// =====================================================

function renderOrders(orders){

    loading.style.display =
        "none";

    ordersContainer.style.display =
        "block";


    if(!orders.length){

        ordersContainer.innerHTML = `

            <div class="empty">

                <div class="empty-title">
                    No orders yet
                </div>

                <div class="empty-text">
                    Your orders will appear here after you place an order.
                </div>

            </div>

        `;

        return;
    }


    ordersContainer.innerHTML =
        orders.map(function(order,index){

            return createOrderCard(
                order,
                index
            );

        }).join("");


    // =================================================
    // EXPAND / COLLAPSE
    // =================================================

    document
        .querySelectorAll(
            ".order-summary"
        )
        .forEach(function(summary){

            summary.addEventListener(
                "click",
                function(){

                    const card =
                        summary.closest(
                            ".order-card"
                        );


                    // Close other cards

                    document
                        .querySelectorAll(
                            ".order-card.open"
                        )
                        .forEach(function(other){

                            if(other !== card){

                                other.classList.remove(
                                    "open"
                                );

                            }

                        });


                    // Open / close selected order

                    card.classList.toggle(
                        "open"
                    );

                }
            );

        });

}


// =====================================================
// CREATE ORDER CARD
// =====================================================

function createOrderCard(
    order,
    index
){

    const product =
        escapeHTML(
            order.product ||
            "LOXICA Product"
        );


    const price =
        Number(
            order.unitPrice ??
            order.price ??
            0
        );


    const quantity =
        Math.max(
            1,
            Number(
                order.quantity
            ) || 1
        );


    const total =
        Number(
            order.totalPrice
        ) ||
        (
            price *
            quantity
        );


    const color =
        escapeHTML(
            order.color ||
            "-"
        );


    const orderId =
        escapeHTML(
            order.orderId ||
            "-"
        );


    const status =
        String(
            order.status ||
            "Pending"
        ).trim();


    const date =
        formatDate(
            order.date
        );


    const statusClass =
        getStatusClass(
            status
        );


    // =================================================
    // TRACKING ID
    // =================================================

    const rawTrackingId =
        String(
            order.trackingId ||
            ""
        ).trim();


    const trackingId =
        escapeHTML(
            rawTrackingId
        );


    let trackingHTML = "";


    /*
       T COLUMN = TRACKING ID

       Tracking ID ഇല്ലെങ്കിൽ
       box കാണിക്കില്ല.
    */

    if(rawTrackingId){

        trackingHTML = `

            <div class="tracking-box">

                <div class="tracking-header">

                    <div class="tracking-icon">
                        🚚
                    </div>

                    <div class="tracking-title">
                        Tracking Information
                    </div>

                </div>


                <div class="tracking-id">
                    ${trackingId}
                </div>


                <div class="tracking-note">
                    Tracking ID added by LOXICA
                </div>

            </div>

        `;

    }


    // =================================================
    // PRODUCT IMAGE
    // =================================================

    const imageUrl =
        String(
            order.image ||
            order.productImage ||
            ""
        ).trim();


    let imageHTML = "";


    /*
       IMPORTANT:

       Image available:
       → Show image

       Image not available:
       → Completely blank box

       NO "Product Image" TEXT
    */

    if(imageUrl){

        imageHTML = `

            <img
                src="${escapeAttribute(imageUrl)}"
                class="product-image"
                alt="${product}"
                onerror="this.style.display='none';"
            >

        `;

    }else{

        imageHTML = "";

    }


    // =================================================
    // RETURN CARD
    // =================================================

    return `

        <div
            class="order-card"
            data-index="${index}"
        >


            <!-- =========================
                 ORDER SUMMARY
            ========================= -->

            <div class="order-summary">


                <!-- PRODUCT IMAGE -->

                <div class="product-image-box">

                    ${imageHTML}

                </div>


                <!-- PRODUCT INFORMATION -->

                <div class="summary-content">

                    <div class="product-name">
                        ${product}
                    </div>


                    <div class="price">
                        ₹${formatMoney(price)}
                    </div>


                    <div class="summary-bottom">

                        <span
                            class="status ${statusClass}"
                        >
                            ${escapeHTML(status)}
                        </span>

                    </div>

                </div>


                <!-- EXPAND ARROW -->

                <div class="expand-icon">
                    ↓
                </div>


            </div>


            <!-- =========================
                 ORDER DETAILS
            ========================= -->

            <div class="order-details">


                <div class="details-title">
                    Order Details
                </div>


                <div class="detail-grid">


                    <!-- ORDER ID -->

                    <div class="detail-box">

                        <div class="detail-label">
                            Order ID
                        </div>

                        <div class="detail-value">
                            ${orderId}
                        </div>

                    </div>


                    <!-- ORDER DATE -->

                    <div class="detail-box">

                        <div class="detail-label">
                            Order Date
                        </div>

                        <div class="detail-value">
                            ${date}
                        </div>

                    </div>


                    <!-- QUANTITY -->

                    <div class="detail-box">

                        <div class="detail-label">
                            Quantity
                        </div>

                        <div class="detail-value">
                            ${quantity}
                        </div>

                    </div>


                    <!-- COLOR -->

                    <div class="detail-box">

                        <div class="detail-label">
                            Color
                        </div>

                        <div class="detail-value">
                            ${color}
                        </div>

                    </div>


                    <!-- UNIT PRICE -->

                    <div class="detail-box">

                        <div class="detail-label">
                            Unit Price
                        </div>

                        <div class="detail-value">
                            ₹${formatMoney(price)}
                        </div>

                    </div>


                    <!-- STATUS -->

                    <div class="detail-box">

                        <div class="detail-label">
                            Status
                        </div>

                        <div class="detail-value">
                            ${escapeHTML(status)}
                        </div>

                    </div>


                </div>


                <!-- =========================
                     TRACKING INFORMATION
                ========================= -->

                ${trackingHTML}


                <!-- =========================
                     TOTAL
                ========================= -->

                <div class="total-box">

                    <div class="total-label">
                        Total Price
                    </div>

                    <div class="total-value">
                        ₹${formatMoney(total)}
                    </div>

                </div>


            </div>


        </div>

    `;

}


// =====================================================
// STATUS CLASS
// =====================================================

function getStatusClass(status){

    const value =
        String(status)
            .toLowerCase()
            .trim();


    if(value === "paid"){
        return "paid";
    }


    if(value === "shipped"){
        return "shipped";
    }


    if(value === "delivered"){
        return "delivered";
    }


    if(
        value === "cancelled" ||
        value === "canceled"
    ){

        return "cancelled";

    }


    return "pending";

}


// =====================================================
// FORMAT DATE
// =====================================================

function formatDate(value){

    if(!value){
        return "-";
    }


    const date =
        new Date(value);


    if(
        isNaN(
            date.getTime()
        )
    ){

        return String(value);

    }


    return date.toLocaleString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


// =====================================================
// FORMAT MONEY
// =====================================================

function formatMoney(value){

    const number =
        Number(value) || 0;


    return number.toLocaleString(
        "en-IN",
        {
            maximumFractionDigits:2
        }
    );

}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHTML(value){

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


// =====================================================
// ESCAPE ATTRIBUTE
// =====================================================

function escapeAttribute(value){

    return escapeHTML(
        value
    );

}


// =====================================================
// ERROR
// =====================================================

function showError(message){

    loading.style.display =
        "none";

    ordersContainer.style.display =
        "block";


    ordersContainer.innerHTML = `

        <div class="error-box">

            ${escapeHTML(message)}

        </div>

    `;

}

</script>

</body>

</html>
