<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOXICA Secure Payment</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
width:100%;
max-width:420px;
background:#fff;
border-radius:18px;
padding:25px;
box-shadow:0 10px 30px rgba(0,0,0,.15);
text-align:center;
}

.logo{
font-size:32px;
font-weight:bold;
letter-spacing:2px;
margin-bottom:10px;
}

.secure{
color:#0a8f3d;
font-size:14px;
margin-bottom:20px;
}

.productImage{
width:100%;
border-radius:15px;
margin-bottom:20px;
}

.productName{
font-size:24px;
font-weight:bold;
margin-bottom:10px;
}

.price{
font-size:30px;
color:#0a8f3d;
font-weight:bold;
margin-bottom:20px;
}

.qr{
width:230px;
border-radius:10px;
margin:15px auto;
display:block;
}

.upi{
margin-top:10px;
font-size:17px;
font-weight:bold;
}

.btn{
display:block;
width:100%;
padding:15px;
margin-top:15px;
border-radius:10px;
text-decoration:none;
font-size:18px;
font-weight:bold;
transition:.3s;
}

.payBtn{
background:#111;
color:white;
}

.payBtn:hover{
background:#333;
}

.formBtn{
background:#0a8f3d;
color:white;
}

.formBtn:hover{
background:#087032;
}

.note{
margin-top:20px;
font-size:14px;
color:#555;
}

</style>
</head>

<body>

<div class="container">

<div class="logo">LOXICA</div>

<div class="secure">
🔒 Secure Checkout
</div>

<img class="productImage"
src="https://via.placeholder.com/400x250?text=LOXICA+PRODUCT">

<div class="productName" id="productName">
Loading Product...
</div>

<div class="price" id="price">
₹0
</div>

<img class="qr"
src="Screenshot_20260801_004011.jpg">

<div class="upi">
UPI ID : 8714917161@fam
</div>
  <p class="note">
Scan the QR code or tap the button below to pay using any UPI app.
</p>

<a id="payBtn" class="btn payBtn" href="#">
💳 Pay Now
</a>

<a id="formBtn" class="btn formBtn" href="#">
✅ I Have Paid
</a>

<p class="note">
After completing the payment, tap <b>I Have Paid</b> and submit your order details.
</p>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const product =
params.get("product") || "JBL Speaker";

const price =
params.get("price") || "999";

document.getElementById("productName").innerText = product;

document.getElementById("price").innerText = "₹" + price;

const upi =
`upi://pay?pa=8714917161@fam&pn=LOXICA&am=${price}&cu=INR`;

document.getElementById("payBtn").href = upi;

const formBase =
"https://docs.google.com/forms/d/e/1FAIpQLSe7Bbt5hdu9qdOzSf6O50Fam3L7pzAXZYkBpz7_1ppYCinJiw/viewform?usp=pp_url&entry.1171881271=";

document.getElementById("formBtn").href =
formBase + encodeURIComponent(product);
  </script>

</body>
</html>
