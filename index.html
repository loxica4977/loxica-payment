
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>LOXICA Checkout</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f5f5f5;
    color:#111;
}

/* HEADER */

.header{
    background:#000;
    color:#fff;
    padding:18px 20px;
    text-align:center;
    font-size:25px;
    font-weight:800;
    letter-spacing:2px;
}

/* MAIN */

.container{
    max-width:700px;
    margin:30px auto;
    padding:0 15px;
}

/* PRODUCT BOX */

.product-box{
    background:#fff;
    border-radius:15px;
    padding:20px;
    box-shadow:0 4px 20px rgba(0,0,0,.08);
    margin-bottom:20px;
}

.product-name{
    font-size:21px;
    font-weight:700;
    margin-bottom:10px;
}

.price-row{
    display:flex;
    align-items:center;
    gap:12px;
}

.original-price{
    text-decoration:line-through;
    color:#888;
    font-size:15px;
}

.price{
    font-size:25px;
    font-weight:800;
}

/* QUANTITY */

.quantity-box{
    margin-top:18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.quantity-title{
    font-weight:700;
}

.quantity-control{
    display:flex;
    align-items:center;
    border:1px solid #ddd;
    border-radius:8px;
    overflow:hidden;
}

.quantity-control button{
    width:40px;
    height:38px;
    border:none;
    background:#000;
    color:#fff;
    font-size:20px;
    cursor:pointer;
}

.quantity-control span{
    width:45px;
    text-align:center;
    font-weight:700;
}

/* TOTAL */

.total-box{
    margin-top:18px;
    padding-top:15px;
    border-top:1px solid #eee;
    display:flex;
    justify-content:space-between;
    font-size:19px;
    font-weight:800;
}

/* FORM */

.form-box{
    background:#fff;
    border-radius:15px;
    padding:20px;
    box-shadow:0 4px 20px rgba(0,0,0,.08);
}

.form-title{
    font-size:21px;
    font-weight:800;
    margin-bottom:18px;
}

.input-group{
    margin-bottom:14px;
}

.input-group label{
    display:block;
    font-size:14px;
    font-weight:700;
    margin-bottom:6px;
}

.input-group input,
.input-group textarea,
.input-group select{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
    font-size:15px;
}

.input-group textarea{
    min-height:90px;
    resize:vertical;
}

.input-group input:focus,
.input-group textarea:focus,
.input-group select:focus{
    border-color:#000;
}

/* COLOR */

.color-box{
    margin-bottom:15px;
}

.color-box label{
    display:block;
    font-size:14px;
    font-weight:700;
    margin-bottom:6px;
}

.color-box input{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:8px;
}

/* BUTTON */

.order-btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:10px;
    background:#000;
    color:#fff;
    font-size:17px;
    font-weight:800;
    cursor:pointer;
    margin-top:10px;
}

.order-btn:hover{
    opacity:.9;
}

.order-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* LOADING */

.loading{
    display:none;
    text-align:center;
    margin-top:15px;
    font-size:14px;
    color:#555;
}

/* FOOTER */

.footer{
    text-align:center;
    margin:30px 0;
    color:#777;
    font-size:13px;
}

/* MOBILE */

@media(max-width:600px){

    .container{
        margin-top:20px;
    }

    .product-name{
        font-size:19px;
    }

    .price{
        font-size:23px;
    }

}

</style>

</head>


<body>


<div class="header">
    LOXICA
</div>


<div class="container">


    <!-- PRODUCT -->

    <div class="product-box">

        <div class="product-name"
             id="productName">
            Product
        </div>

        <div class="price-row">

            <div class="original-price"
                 id="originalPrice">
            </div>

            <div class="price"
                 id="productPrice">
                ₹0
            </div>

        </div>


        <!-- QUANTITY -->

        <div class="quantity-box">

            <div class="quantity-title">
                Quantity
            </div>

            <div class="quantity-control">

                <button
                    type="button"
                    onclick="changeQuantity(-1)">
                    −
                </button>

                <span id="quantity">
                    1
                </span>

                <button
                    type="button"
                    onclick="changeQuantity(1)">
                    +
                </button>

            </div>

        </div>


        <!-- TOTAL -->

        <div class="total-box">

            <span>
                Total
            </span>

            <span id="totalPrice">
                ₹0
            </span>

        </div>

    </div>



    <!-- FORM -->

    <div class="form-box">

        <div class="form-title">
            Delivery Details
        </div>


        <form id="checkoutForm">


            <div class="input-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    required
                    autocomplete="name"
                    placeholder="Enter your full name">

            </div>


            <div class="input-group">

                <label>
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    required
                    autocomplete="tel"
                    placeholder="Enter phone number">

            </div>


            <div class="input-group">

                <label>
                    Address
                </label>

                <textarea
                    id="address"
                    required
                    autocomplete="street-address"
                    placeholder="House name, place, etc."></textarea>

            </div>


            <div class="input-group">

                <label>
                    Landmark
                </label>

                <input
                    type="text"
                    id="landmark"
                    autocomplete="off"
                    placeholder="Nearby landmark">

            </div>


            <div class="input-group">

                <label>
                    City
                </label>

                <input
                    type="text"
                    id="city"
                    required
                    autocomplete="address-level2"
                    placeholder="City">

            </div>


            <div class="input-group">

                <label>
                    State
                </label>

                <select
                    id="state"
                    required>

                    <option value="">
                        Select State
                    </option>

                    <option>Kerala</option>
                    <option>Tamil Nadu</option>
                    <option>Karnataka</option>
                    <option>Andhra Pradesh</option>
                    <option>Telangana</option>
                    <option>Maharashtra</option>
                    <option>Goa</option>
                    <option>Gujarat</option>
                    <option>Rajasthan</option>
                    <option>Delhi</option>
                    <option>West Bengal</option>
                    <option>Uttar Pradesh</option>
                    <option>Madhya Pradesh</option>
                    <option>Bihar</option>
                    <option>Punjab</option>
                    <option>Haryana</option>
                    <option>Other</option>

                </select>

            </div>


            <div class="input-group">

                <label>
                    Pincode
                </label>

                <input
                    type="text"
                    id="pincode"
                    required
                    inputmode="numeric"
                    maxlength="6"
                    autocomplete="postal-code"
                    placeholder="6 digit pincode">

            </div>


            <div class="color-box">

                <label>
                    Color
                </label>

                <input
                    type="text"
                    id="color"
                    placeholder="Example: Black">

            </div>


            <button
                type="submit"
                class="order-btn"
                id="orderButton">

                Continue to Payment

            </button>


            <div
                class="loading"
                id="loading">

                Processing your order...

            </div>


        </form>

    </div>


    <div class="footer">

        Secure Checkout • LOXICA

    </div>


</div>



<script>


/* ======================================
   URL PARAMETERS
====================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const product =
    params.get("product") || "";


const price =
    Number(
        params.get("price") || 0
    );


const originalPrice =
    Number(
        params.get("originalPrice") || 0
    );


const session =
    params.get("session") || "";


const memberId =
    params.get("memberId") || "";


const urlColor =
    params.get("color") || "";


let quantity =
    Number(
        params.get("quantity") || 1
    );


if(quantity < 1){
    quantity = 1;
}



/* ======================================
   ELEMENTS
====================================== */

const productNameElement =
    document.getElementById("productName");


const productPriceElement =
    document.getElementById("productPrice");


const originalPriceElement =
    document.getElementById("originalPrice");


const quantityElement =
    document.getElementById("quantity");


const totalPriceElement =
    document.getElementById("totalPrice");


const colorElement =
    document.getElementById("color");


/* ======================================
   PRODUCT DATA
====================================== */

productNameElement.textContent =
    product;


productPriceElement.textContent =
    "₹" + price.toLocaleString("en-IN");


if(originalPrice > price){

    originalPriceElement.textContent =
        "₹" +
        originalPrice.toLocaleString("en-IN");

}else{

    originalPriceElement.style.display =
        "none";

}


if(urlColor){

    colorElement.value =
        urlColor;

}


/* ======================================
   TOTAL
====================================== */

function updateTotal(){

    quantityElement.textContent =
        quantity;


    const total =
        price * quantity;


    totalPriceElement.textContent =
        "₹" +
        total.toLocaleString("en-IN");

}


updateTotal();



/* ======================================
   QUANTITY
====================================== */

function changeQuantity(amount){

    quantity += amount;


    if(quantity < 1){

        quantity = 1;

    }


    updateTotal();

}



/* ======================================
   SESSION STORAGE
====================================== */

const storageKey =
    "loxica_checkout";


function saveCheckoutData(){

    const data = {

        product: product,

        price: price,

        originalPrice:
            originalPrice,

        session: session,

        memberId: memberId,

        color:
            colorElement.value,

        quantity: quantity,

        name:
            document.getElementById("name").value,

        phone:
            document.getElementById("phone").value,

        address:
            document.getElementById("address").value,

        landmark:
            document.getElementById("landmark").value,

        city:
            document.getElementById("city").value,

        state:
            document.getElementById("state").value,

        pincode:
            document.getElementById("pincode").value

    };


    sessionStorage.setItem(
        storageKey,
        JSON.stringify(data)
    );

}



/* ======================================
   RESTORE DATA
====================================== */

try{

    const saved =
        sessionStorage.getItem(
            storageKey
        );


    if(saved){

        const data =
            JSON.parse(saved);


        if(
            data.product === product &&
            Number(data.price) === price
        ){

            if(data.name){

                document.getElementById(
                    "name"
                ).value =
                    data.name;

            }


            if(data.phone){

                document.getElementById(
                    "phone"
                ).value =
                    data.phone;

            }


            if(data.address){

                document.getElementById(
                    "address"
                ).value =
                    data.address;

            }


            if(data.landmark){

                document.getElementById(
                    "landmark"
                ).value =
                    data.landmark;

            }


            if(data.city){

                document.getElementById(
                    "city"
                ).value =
                    data.city;

            }


            if(data.state){

                document.getElementById(
                    "state"
                ).value =
                    data.state;

            }


            if(data.pincode){

                document.getElementById(
                    "pincode"
                ).value =
                    data.pincode;

            }


            if(data.color){

                colorElement.value =
                    data.color;

            }


            if(data.quantity){

                quantity =
                    Number(data.quantity);

                updateTotal();

            }

        }

    }

}catch(error){

    console.log(
        "Session restore error:",
        error
    );

}



/* ======================================
   APPS SCRIPT
====================================== */

const scriptURL =
    "YOUR_APPS_SCRIPT_WEB_APP_URL";



/* ======================================
   CHECKOUT FORM
====================================== */

document
.getElementById("checkoutForm")
.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const button =
            document.getElementById(
                "orderButton"
            );


        const loading =
            document.getElementById(
                "loading"
            );


        const name =
            document.getElementById(
                "name"
            ).value.trim();


        const phone =
            document.getElementById(
                "phone"
            ).value.trim();


        const address =
            document.getElementById(
                "address"
            ).value.trim();


        const landmark =
            document.getElementById(
                "landmark"
            ).value.trim();


        const city =
            document.getElementById(
                "city"
            ).value.trim();


        const state =
            document.getElementById(
                "state"
            ).value.trim();


        const pincode =
            document.getElementById(
                "pincode"
            ).value.trim();


        const color =
            colorElement.value.trim();


        /* VALIDATION */

        if(!name ||
           !phone ||
           !address ||
           !city ||
           !state ||
           !pincode){

            alert(
                "Please fill all required details."
            );

            return;

        }


        if(pincode.length !== 6){

            alert(
                "Please enter a valid 6 digit pincode."
            );

            return;

        }


        if(phone.length < 10){

            alert(
                "Please enter a valid phone number."
            );

            return;

        }



        /* TOTAL */

        const totalPrice =
            price * quantity;



        /* SAVE */

        saveCheckoutData();



        /* UI */

        button.disabled =
            true;

        button.textContent =
            "Processing...";

        loading.style.display =
            "block";



        /* ORDER DATA */

        const orderData = {

            product:
                product,

            price:
                price,

            originalPrice:
                originalPrice,

            quantity:
                quantity,

            totalPrice:
                totalPrice,

            name:
                name,

            phone:
                phone,

            address:
                address,

            landmark:
                landmark,

            city:
                city,

            state:
                state,

            pincode:
                pincode,

            color:
                color,

            session:
                session,

            memberId:
                memberId

        };



        try{


            const response =
                await fetch(
                    scriptURL,
                    {

                        method:"POST",

                        body:
                            JSON.stringify(
                                orderData
                            )

                    }
                );


            const result =
                await response.json();



            if(
                !result ||
                !result.success
            ){

                throw new Error(
                    "Order creation failed"
                );

            }



            /* ======================================
               ORDER ID
            ====================================== */

            const orderId =
                result.orderId || "";



            /* ======================================
               PAYMENT URL
            ====================================== */

            const paymentURL =
                "payment.html?" +

                "product=" +
                encodeURIComponent(
                    product
                ) +

                "&price=" +
                encodeURIComponent(
                    price
                ) +

                "&originalPrice=" +
                encodeURIComponent(
                    originalPrice
                ) +

                "&quantity=" +
                encodeURIComponent(
                    quantity
                ) +

                "&totalPrice=" +
                encodeURIComponent(
                    totalPrice
                ) +

                "&orderId=" +
                encodeURIComponent(
                    orderId
                ) +

                "&color=" +
                encodeURIComponent(
                    color
                ) +

                "&memberId=" +
                encodeURIComponent(
                    memberId
                );



            /* ======================================
               REDIRECT TO PAYMENT

               IMPORTANT:
               replace() removes INDEX.HTML
               from browser history.
            ====================================== */

            window.location.replace(
                paymentURL
            );


        }catch(error){

            console.error(
                error
            );


            alert(
                "Something went wrong. Please try again."
            );


            button.disabled =
                false;


            button.textContent =
                "Continue to Payment";


            loading.style.display =
                "none";

        }

    }
);



/* ======================================
   AUTO SAVE FORM DATA
====================================== */

const formInputs =
    document.querySelectorAll(
        "#checkoutForm input, #checkoutForm textarea, #checkoutForm select"
    );


formInputs.forEach(
    function(input){

        input.addEventListener(
            "input",
            saveCheckoutData
        );

        input.addEventListener(
            "change",
            saveCheckoutData
        );

    }
);

</script>


</body>
</html>
