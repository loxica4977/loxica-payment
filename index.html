<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LOXICA Secure Checkout</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
width:100%;
max-width:420px;
background:white;
border-radius:18px;
padding:25px;
box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.logo{
text-align:center;
font-size:32px;
font-weight:bold;
letter-spacing:2px;
}

.secure{
text-align:center;
color:#0a8f3d;
margin:10px 0 20px;
}

.product{
text-align:center;
font-size:20px;
font-weight:bold;
}

.price{
text-align:center;
font-size:28px;
color:#0a8f3d;
font-weight:bold;
margin:10px 0 20px;
}

input,textarea{
width:100%;
padding:13px;
margin-bottom:12px;
border:1px solid #ddd;
border-radius:8px;
font-size:15px;
}

textarea{
height:80px;
resize:none;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:10px;
background:#111;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#333;
}

.note{
text-align:center;
font-size:13px;
color:#555;
margin-top:15px;
}
</style>

</head>

<body>

<div class="container">

<div class="logo">LOXICA</div>

<div class="secure">
🔒 Secure Checkout
</div>

<div class="product" id="product">
Product
</div>

<div class="price" id="price">
₹0
</div>


<form id="orderForm">

<input id="name" placeholder="Full Name" required>

<input id="phone" placeholder="Phone Number" required>

<textarea id="address" placeholder="Full Address" required></textarea>

<input id="landmark" placeholder="Landmark" required>

<input id="city" placeholder="City" required>

<input id="state" placeholder="State" required>

<input id="pincode" placeholder="Pincode" required>


<button type="submit">
Continue To Payment 💳
</button>

</form>


<p class="note">
Fill details first. After submitting, UPI payment will open.
</p>


</div>



<script>

const scriptURL =
"https://script.google.com/macros/s/AKfycbx61ZbcXj5ySQ0ovhGj-SjnKHpav818Gp4-uUcdBTfpsCd2ZU8B5TxuOWLKklvfnLKj/exec";


const params = new URLSearchParams(window.location.search);


const product =
params.get("product") || "LOXICA Product";


const price =
params.get("price") || "0";


document.getElementById("product").innerText = product;

document.getElementById("price").innerText = "₹" + price;



document.getElementById("orderForm")
.addEventListener("submit",function(e){

e.preventDefault();


const data={

product:product,

price:price,

name:document.getElementById("name").value,

phone:document.getElementById("phone").value,

address:document.getElementById("address").value,

landmark:document.getElementById("landmark").value,

city:document.getElementById("city").value,

state:document.getElementById("state").value,

pincode:document.getElementById("pincode").value

};



fetch(scriptURL,{

method:"POST",

body:JSON.stringify(data)

})

.then(()=>{


const upi =
"upi://pay?pa=8714917161@fam&pn=LOXICA&am="+price+"&cu=INR";


window.location.href = upi;


})


.catch(()=>{

alert("Something went wrong. Try again.");

});


});


</script>


</body>
</html>
