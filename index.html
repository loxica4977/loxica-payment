<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LOXICA Checkout</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#eaeded;
    color:#111;
    min-height:100vh;
}

.header{
    width:100%;
    background:#111;
    color:white;
    height:64px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.logo{
    width:120px;
    height:auto;
    max-height:48px;
    object-fit:contain;
    display:block;
}

.main{
    width:100%;
    max-width:1100px;
    margin:25px auto;
    padding:0 15px;
}

.checkout-title{
    font-size:28px;
    font-weight:500;
    margin-bottom:18px;
}

.checkout-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:20px;
}

.card{
    background:white;
    border-radius:5px;
    padding:22px;
    border:1px solid #ddd;
    margin-bottom:18px;
}

.card-title{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:20px;
    font-weight:600;
    margin-bottom:18px;
}

.number{
    width:30px;
    height:30px;
    border-radius:50%;
    background:#111;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    font-weight:bold;
}

.product-box{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-bottom:18px;
    border-bottom:1px solid #ddd;
    margin-bottom:18px;
}

.product-name{
    font-size:18px;
    font-weight:600;
    max-width:65%;
}

.product-price{
    font-size:23px;
    font-weight:bold;
    color:#0a8f3d;
    text-align:right;
}

.original-price{
    display:block;
    font-size:14px;
    font-weight:normal;
    color:#777;
    text-decoration:line-through;
    margin-bottom:3px;
}

.offer-price{
    display:block;
    font-size:23px;
    font-weight:bold;
    color:#0a8f3d;
}

label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:6px;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    border:1px solid #a6a6a6;
    border-radius:4px;
    font-size:15px;
    outline:none;
    background:#fff;
    margin-bottom:14px;
}

input:focus,
textarea:focus,
select:focus{
    border:2px solid #111;
}

textarea{
    height:80px;
    resize:vertical;
}

.phone-group{
    display:flex;
    margin-bottom:14px;
}

.phone-code{
    width:55px;
    height:45px;
    background:#eee;
    border:1px solid #a6a6a6;
    border-right:none;
    border-radius:4px 0 0 4px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.phone-group input{
    height:45px;
    margin:0;
    border-radius:0 4px 4px 0;
}

.two-column{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.quantity-box{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:135px;
    height:45px;
    border:1px solid #a6a6a6;
    border-radius:4px;
    overflow:hidden;
    background:#fff;
    margin-bottom:14px;
}

.quantity-btn{
    width:42px;
    height:45px;
    border:none;
    background:#f3f3f3;
    font-size:22px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
}

.quantity-btn:hover{
    background:#e5e5e5;
}

.quantity-value{
    width:50px;
    text-align:center;
    font-size:17px;
    font-weight:bold;
}

.color-box{
    margin-top:2px;
    margin-bottom:14px;
}

.selected-color{
    width:100%;
    min-height:45px;
    padding:12px;
    border:1px solid #a6a6a6;
    border-radius:4px;
    background:#f3f3f3;
    font-size:15px;
    font-weight:bold;
    color:#111;
    display:flex;
    align-items:center;
}

.selected-color.empty{
    color:#777;
    font-weight:normal;
}

.continue-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:4px;
    background:#111;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    margin-top:4px;

    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:calc(100% - 30px);
    max-width:1070px;
    z-index:9999;
}

.continue-btn:hover{
    background:#333;
}

.continue-btn:disabled{
    opacity:.8;
    cursor:not-allowed;
}

.spinner{
    display:inline-block;
    width:17px;
    height:17px;
    border:3px solid rgba(255,255,255,.4);
    border-top:3px solid white;
    border-radius:50%;
    animation:spin 1s linear infinite;
    vertical-align:middle;
    margin-right:8px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.summary{
    background:white;
    border:1px solid #ddd;
    border-radius:5px;
    padding:20px;
    height:max-content;
    position:static;
}

.summary h2{
    font-size:21px;
    margin-bottom:18px;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:14px;
    font-size:14px;
}

.summary-product{
    font-weight:600;
    line-height:1.4;
    text-align:right;
    max-width:65%;
    word-break:break-word;
}

.summary-price-box{
    text-align:right;
}

.summary-original-price{
    display:block;
    color:#777;
    text-decoration:line-through;
    font-size:13px;
    margin-bottom:2px;
}

.summary-offer-price{
    display:block;
    font-weight:bold;
}

.total{
    border-top:1px solid #ddd;
    padding-top:15px;
    margin-top:8px;
    display:flex;
    justify-content:space-between;
    font-size:21px;
    font-weight:bold;
    color:#0a8f3d;
}

.secure-box{
    margin-top:20px;
    padding:14px;
    background:#f7f7f7;
    border-radius:4px;
    font-size:13px;
    color:#555;
    line-height:1.5;
}

.secure-box i{
    color:#0a8f3d;
    margin-right:6px;
}

.note{
    font-size:12px;
    color:#666;
    text-align:center;
    margin-top:12px;
}

.copyright{
    width:100%;
    text-align:center;
    font-size:11px;
    color:#777;
    padding:18px 10px;
    margin-bottom:65px;
}

@media(max-width:750px){

    .header{
        height:58px;
    }

    .logo{
        width:105px;
        max-height:44px;
    }

    .main{
        margin-top:18px;
    }

    .checkout-title{
        font-size:23px;
    }

    .checkout-grid{
        grid-template-columns:1fr;
    }

    .summary{
        position:static;
    }

}

@media(max-width:430px){

    .main{
        padding:0 10px;
    }

    .card,
    .summary{
        padding:17px;
    }

    .two-column{
        grid-template-columns:1fr;
        gap:0;
    }

    .product-name{
        font-size:16px;
    }

    .product-price{
        font-size:20px;
    }

    .offer-price{
        font-size:20px;
    }

}

</style>

</head>

<body>

<header class="header">

<img
src="LOXICA-Logo-Header.png"
alt="LOXICA"
class="logo">

</header>

<main class="main">

<div class="checkout-title">
Checkout
</div>

<div class="checkout-grid">

<div class="details-card">

<!-- PRODUCT DETAILS -->

<div class="card-title">
<div class="number">1</div>
Product Details
</div>

<div class="product-box">

<div
class="product-name"
id="product">
Product
</div>

<div

id="price">
₹0
</div>

</div>

<!-- DELIVERY ADDRESS -->

Delivery Address

<input

<div>

<option>Chhattisgarh</option>

<option>Kerala</option>
<option>Madhya Pradesh</option>
<option>Maharashtra</option>
<option>Manipur</option>
<option>Meghalaya</option>
<option>Mizoram</option>
<option>Nagaland</option>
<option>Odisha</option>
<option>Punjab</option>
<option>Rajasthan</option>
<option>Sikkim</option>
<option>Tamil Nadu</option>
<option>Telangana</option>
<option>Tripura</option>

<!-- ORDER SUMMARY -->

<aside class="summary">

<div class="summary-row">

id="summaryProduct">
Product </span>

</div>

class="summary-row"
id="summaryColorRow"
style="display:none;">

id="summaryColor">

id="summaryOfferPrice">
₹0 </span>

</span>

₹0
</span>

<!-- CONTINUE BUTTON BELOW ORDER SUMMARY -->

Continue To Payment

<script>

const scriptURL =
"https://script.google.com/macros/s/AKfycbx61ZbcXj5ySQ0ovhGj-SjnKHpav818Gp4-uUcdBTfpsCd2ZU8B5TxuOWLKklvfnLKj/exec";


const params =
new URLSearchParams(
window.location.search
);

const product =
(params.get("product") || "LOXICA Product").trim();

const price =
(params.get("price") || "0").trim();

const originalPrice =
(params.get("originalPrice") || price).trim();

const checkoutSession =
(params.get("session") || "").trim();

let memberId =
(params.get("memberId") || "").trim();

const selectedColorFromURL =
(params.get("color") || "").trim();


let quantity =
parseInt(
params.get("quantity") || "1",
10
);

if(
isNaN(quantity) ||
quantity < 1
){
quantity = 1;
}


const storageKey =
checkoutSession
? "loxicaCheckout_" + checkoutSession
: null;


const unitPrice =
Number(price) || 0;

const unitOriginalPrice =
Number(originalPrice) || unitPrice;


document.getElementById("product").innerText =
product;

document.getElementById("summaryProduct").innerText =
product;


function updateQuantityDisplay(){

    document.getElementById(
        "quantityValue"
    ).innerText = quantity;

}


function updatePrices(){

    const totalPrice =
        unitPrice * quantity;

    const totalOriginalPrice =
        unitOriginalPrice * quantity;

    const productPriceElement =
        document.getElementById("price");


    if(
        unitOriginalPrice !== unitPrice &&
        unitOriginalPrice > 0
    ){

        productPriceElement.innerHTML =
            '<span class="original-price">₹' +
            totalOriginalPrice.toLocaleString("en-IN") +
            '</span>' +

            '<span class="offer-price">₹' +
            totalPrice.toLocaleString("en-IN") +
            '</span>';

    }else{

        productPriceElement.innerHTML =
            '<span class="offer-price">₹' +
            totalPrice.toLocaleString("en-IN") +
            '</span>';

    }


    document.getElementById(
        "summaryOriginalPrice"
    ).innerText =
        "₹" + totalOriginalPrice.toLocaleString("en-IN");


    document.getElementById(
        "summaryOfferPrice"
    ).innerText =
        "₹" + totalPrice.toLocaleString("en-IN");


    document.getElementById(
        "summaryTotal"
    ).innerText =
        "₹" + totalPrice.toLocaleString("en-IN");


    if(
        unitOriginalPrice === unitPrice ||
        unitOriginalPrice === 0
    ){

        document.getElementById(
            "summaryOriginalPrice"
        ).style.display = "none";

    }else{

        document.getElementById(
            "summaryOriginalPrice"
        ).style.display = "block";

    }

}


document.getElementById(
    "minusBtn"
).addEventListener(
    "click",
    function(){

        if(quantity > 1){

            quantity--;

            updateQuantityDisplay();
            updatePrices();
            autoSaveCheckoutDetails();

        }

    }
);


document.getElementById(
    "plusBtn"
).addEventListener(
    "click",
    function(){

        quantity++;

        updateQuantityDisplay();
        updatePrices();
        autoSaveCheckoutDetails();

    }
);


function updateColorDisplay(colorValue){

    const color =
        (colorValue || "").trim();

    const colorSection =
        document.getElementById("colorSection");

    const colorDisplay =
        document.getElementById("selectedColorDisplay");

    const summaryColorRow =
        document.getElementById("summaryColorRow");

    const summaryColor =
        document.getElementById("summaryColor");


    if(color){

        colorSection.style.display = "block";

        colorDisplay.innerText = color;

        colorDisplay.classList.remove("empty");

        summaryColorRow.style.display = "flex";

        summaryColor.innerText = color;

    }else{

        colorSection.style.display = "none";

        summaryColorRow.style.display = "none";

        colorDisplay.innerText = "-";

        colorDisplay.classList.add("empty");

        summaryColor.innerText = "-";

    }

}


updateQuantityDisplay();

updatePrices();

updateColorDisplay(
    selectedColorFromURL
);


function resetContinueButton(){

    const submitBtn =
        document.querySelector(".continue-btn");

    if(!submitBtn){
        return;
    }

    submitBtn.disabled = false;

    submitBtn.style.background = "#111";

    submitBtn.innerHTML =
        "Continue To Payment";

}


function clearCheckoutForm(){

    document.getElementById("name").value = "";

    document.getElementById("phone").value = "";

    document.getElementById("address").value = "";

    document.getElementById("landmark").value = "";

    document.getElementById("city").value = "";

    document.getElementById("state").value = "";

    document.getElementById("pincode").value = "";

    quantity = 1;

    updateQuantityDisplay();

    updatePrices();

    updateColorDisplay(
        selectedColorFromURL
    );

}


function restoreCheckout(){

    resetContinueButton();


    if(!storageKey){

        clearCheckoutForm();

        return;

    }


    const savedDetails =
        sessionStorage.getItem(storageKey);


    if(!savedDetails){

        clearCheckoutForm();

        return;

    }


    try{

        const data =
            JSON.parse(savedDetails);


        document.getElementById("name").value =
            data.name || "";


        document.getElementById("phone").value =
            (data.phone || "")
            .replace(/^\+91/, "");


        document.getElementById("address").value =
            data.address || "";


        document.getElementById("landmark").value =
            data.landmark || "";


        document.getElementById("city").value =
            data.city || "";


        document.getElementById("state").value =
            data.state || "";


        document.getElementById("pincode").value =
            data.pincode || "";


        if(
            !memberId &&
            data.memberId
        ){

            memberId =
                String(data.memberId).trim();

        }


        if(data.quantity){

            quantity =
                parseInt(
                    data.quantity,
                    10
                );

            if(
                isNaN(quantity) ||
                quantity < 1
            ){

                quantity = 1;

            }

        }


        const savedColor =
            selectedColorFromURL ||
            data.color ||
            "";


        updateColorDisplay(savedColor);

        updateQuantityDisplay();

        updatePrices();


        console.log(
            "RESTORED MEMBER ID:",
            memberId
        );

        console.log(
            "RESTORED QUANTITY:",
            quantity
        );

    }
    catch(error){

        console.log(
            "Could not restore checkout details:",
            error
        );

        clearCheckoutForm();

    }

}


window.addEventListener(
    "pageshow",
    function(){

        resetContinueButton();

        restoreCheckout();

    }
);


function autoSaveCheckoutDetails(){

    if(!storageKey){
        return;
    }


    const savedData = {

        product: product,

        price: price,

        originalPrice: originalPrice,

        quantity: quantity,

        name:
            document.getElementById("name").value,

        phone:
            "+91" +
            document.getElementById("phone").value,

        address:
            document.getElementById("address").value,

        landmark:
            document.getElementById("landmark").value,

        city:
            document.getElementById("city").value,

        state:
            document.getElementById("state").value,

        pincode:
            document.getElementById("pincode").value,

        color:
            selectedColorFromURL || "",

        memberId:
            String(memberId || "").trim()

    };


    const oldData =
        sessionStorage.getItem(storageKey);


    if(oldData){

        try{

            const old =
                JSON.parse(oldData);

            if(old.orderId){

                savedData.orderId =
                    old.orderId;

            }

        }
        catch(error){

            console.log(
                "Could not keep old order ID:",
                error
            );

        }

    }


    sessionStorage.setItem(
        storageKey,
        JSON.stringify(savedData)
    );

}


[
    "name",
    "phone",
    "address",
    "landmark",
    "city",
    "state",
    "pincode"
].forEach(function(id){

    const input =
        document.getElementById(id);

    if(!input){
        return;
    }

    input.addEventListener(
        "input",
        autoSaveCheckoutDetails
    );

    input.addEventListener(
        "change",
        autoSaveCheckoutDetails
    );

});


document.getElementById(
    "phone"
).addEventListener(
    "input",
    function(){

        this.value =
            this.value
            .replace(/\D/g,"")
            .slice(0,10);

        autoSaveCheckoutDetails();

    }
);


document.getElementById(
    "pincode"
).addEventListener(
    "input",
    function(){

        this.value =
            this.value
            .replace(/\D/g,"")
            .slice(0,6);

        autoSaveCheckoutDetails();

    }
);


/* ==================================================
   FORM SUBMIT
   ONLY SAVE TO SESSION
   DO NOT SEND TO GOOGLE SHEET
================================================== */

document.getElementById(
    "orderForm"
).addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        const submitBtn =
            document.querySelector(".continue-btn");


        const nameValue =
            document.getElementById("name")
            .value
            .trim();


        const addressValue =
            document.getElementById("address")
            .value
            .trim();


        const landmarkValue =
            document.getElementById("landmark")
            .value
            .trim();


        const cityValue =
            document.getElementById("city")
            .value
            .trim();


        const stateValue =
            document.getElementById("state")
            .value
            .trim();


        if(
            !nameValue ||
            !addressValue ||
            !landmarkValue ||
            !cityValue ||
            !stateValue
        ){

            alert(
                "Please fill in all delivery details."
            );

            return;

        }


        const phoneValue =
            document.getElementById("phone")
            .value
            .replace(/\D/g,"")
            .trim();


        if(
            !/^[0-9]{10}$/.test(phoneValue)
        ){

            alert(
                "Please enter a valid 10-digit mobile number."
            );

            return;

        }


        const pincodeValue =
            document.getElementById("pincode")
            .value
            .replace(/\D/g,"")
            .trim();


        if(
            !/^[0-9]{6}$/.test(pincodeValue)
        ){

            alert(
                "Please enter a valid 6-digit pincode."
            );

            return;

        }


        if(!memberId){

            console.error(
                "MEMBER ID MISSING"
            );

            alert(
                "Customer account information is missing. Please go back to the product page and try again."
            );

            return;

        }


        quantity =
            parseInt(quantity,10);


        if(
            isNaN(quantity) ||
            quantity < 1
        ){

            quantity = 1;

        }


        let colorValue =
            selectedColorFromURL;


        if(
            !colorValue &&
            storageKey
        ){

            const savedDetails =
                sessionStorage.getItem(storageKey);


            if(savedDetails){

                try{

                    const oldData =
                        JSON.parse(savedDetails);


                    if(oldData.color){

                        colorValue =
                            String(
                                oldData.color
                            ).trim();

                    }

                }
                catch(error){

                    console.log(
                        "Could not read saved color:",
                        error
                    );

                }

            }

        }


        if(!colorValue){

            colorValue = "-";

        }


        const totalPrice =
            unitPrice * quantity;


        const currentData = {

            product: product,

            price: unitPrice,

            originalPrice:
                unitOriginalPrice,

            quantity: quantity,

            totalPrice: totalPrice,

            name: nameValue,

            phone:
                "+91" + phoneValue,

            address: addressValue,

            landmark: landmarkValue,

            city: cityValue,

            state: stateValue,

            pincode: pincodeValue,

            color: colorValue,

            memberId:
                String(memberId).trim()

        };


        /* KEEP EXISTING ORDER ID IF PRESENT */

        if(storageKey){

            const savedDetails =
                sessionStorage.getItem(storageKey);


            if(savedDetails){

                try{

                    const oldData =
                        JSON.parse(savedDetails);


                    if(oldData.orderId){

                        currentData.orderId =
                            String(
                                oldData.orderId
                            ).trim();

                    }

                }
                catch(error){

                    console.log(
                        "Could not read previous checkout:",
                        error
                    );

                }

            }

        }


        /* ==========================================
           SAVE ONLY TO SESSION STORAGE
           NO GOOGLE SHEET SAVE HERE
        ========================================== */

        if(storageKey){

            sessionStorage.setItem(
                storageKey,
                JSON.stringify(currentData)
            );

        }


        submitBtn.disabled = true;

        submitBtn.style.background =
            "#2563EB";

        submitBtn.innerHTML =
            '<span class="spinner"></span>Opening Payment...';


        console.log(
            "CHECKOUT DETAILS SAVED LOCALLY ONLY:",
            currentData
        );


        /* ==========================================
           PAYMENT URL
        ========================================== */

        let paymentURL =
            "payment.html" +

            "?product=" +
            encodeURIComponent(product) +

            "&price=" +
            encodeURIComponent(unitPrice) +

            "&originalPrice=" +
            encodeURIComponent(unitOriginalPrice) +

            "&quantity=" +
            encodeURIComponent(quantity) +

            "&totalPrice=" +
            encodeURIComponent(totalPrice);


        /*
           Existing orderId undenkil mathram
           payment URL-il pass cheyyum.
        */

        if(currentData.orderId){

            paymentURL +=
                "&orderId=" +
                encodeURIComponent(
                    currentData.orderId
                );

        }


        if(checkoutSession){

            paymentURL +=
                "&session=" +
                encodeURIComponent(
                    checkoutSession
                );

        }


        if(
            colorValue &&
            colorValue !== "-"
        ){

            paymentURL +=
                "&color=" +
                encodeURIComponent(
                    colorValue
                );

        }


        paymentURL +=
            "&memberId=" +
            encodeURIComponent(
                memberId
            );


        console.log(
            "PAYMENT URL:",
            paymentURL
        );


        /*
           IMPORTANT REDIRECT

           replace() preserves the existing
           browser history behavior.
        */

        window.location.replace(
            paymentURL
        );

    }
);

</script>

</body>
</html>
