<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>LOXICA Checkout</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#eaeded;
    color:#111;
}

.header{
    background:#131921;
    color:#fff;
    min-height:65px;
    display:flex;
    align-items:center;
    padding:0 6%;
}

.logo{
    font-size:27px;
    font-weight:800;
    letter-spacing:2px;
}

.logo span{
    color:#19d66b;
}

.container{
    max-width:1100px;
    margin:25px auto;
    padding:0 15px;
}

.checkout-title{
    font-size:28px;
    font-weight:700;
    margin-bottom:20px;
}

.checkout-grid{
    display:grid;
    grid-template-columns:1fr 360px;
    gap:20px;
}

.box{
    background:#fff;
    border-radius:5px;
    padding:22px;
    margin-bottom:18px;
    box-shadow:0 1px 4px rgba(0,0,0,.12);
}

.box-title{
    font-size:20px;
    font-weight:700;
    margin-bottom:18px;
}

.box-title i{
    margin-right:7px;
}

label{
    display:block;
    font-size:14px;
    font-weight:600;
    margin-bottom:7px;
}

input,
textarea,
select{
    width:100%;
    border:1px solid #a6a6a6;
    border-radius:4px;
    padding:12px;
    font-size:15px;
    outline:none;
    margin-bottom:15px;
    background:#fff;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#007eb9;
    box-shadow:0 0 0 2px rgba(0,126,185,.15);
}

textarea{
    min-height:90px;
    resize:vertical;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.product-box{
    display:flex;
    align-items:center;
    gap:15px;
}

.product-info{
    flex:1;
}

.product-name{
    font-size:18px;
    font-weight:700;
    margin-bottom:8px;
}

.product-price{
    font-size:23px;
    font-weight:800;
}

.original-price{
    color:#777;
    text-decoration:line-through;
    margin-left:8px;
    font-size:15px;
}

.color-box{
    background:#f7f7f7;
    border:1px solid #ddd;
    border-radius:5px;
    padding:12px;
    margin-top:5px;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    margin-bottom:14px;
    font-size:15px;
    gap:15px;
}

.summary-row span:last-child{
    text-align:right;
}

.summary-total{
    border-top:1px solid #ddd;
    padding-top:16px;
    margin-top:8px;
    font-size:21px;
    font-weight:800;
}

.continue-btn{
    width:100%;
    background:#ffd814;
    border:1px solid #fcd200;
    border-radius:6px;
    padding:15px;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}

.continue-btn:hover{
    background:#f7ca00;
}

.continue-btn:disabled{
    background:#999;
    border-color:#999;
    cursor:not-allowed;
}

.secure{
    text-align:center;
    color:#555;
    font-size:13px;
    margin-top:15px;
}

.secure i{
    color:#19a95a;
    margin-right:5px;
}

.footer{
    text-align:center;
    color:#777;
    font-size:13px;
    padding:20px;
}

.error{
    color:#d00;
    font-size:13px;
    margin-top:-8px;
    margin-bottom:12px;
    display:none;
}

.required{
    color:#d00;
}

@media(max-width:800px){

    .checkout-grid{
        grid-template-columns:1fr;
    }

    .row{
        grid-template-columns:1fr;
        gap:0;
    }

    .header{
        padding:0 20px;
    }

    .container{
        margin-top:18px;
    }

    .checkout-title{
        font-size:24px;
    }

    .box{
        padding:18px;
    }

}

</style>

</head>


<body>


<header class="header">

    <div class="logo">
        LOXI<span>CA</span>
    </div>

</header>


<div class="container">


    <div class="checkout-title">
        Checkout
    </div>


    <div class="checkout-grid">


        <!-- =========================================
             LEFT SIDE
             ========================================= -->

        <div>


            <!-- PRODUCT -->

            <div class="box">

                <div class="box-title">

                    <i class="fa-solid fa-box"></i>

                    Your Product

                </div>


                <div class="product-box">

                    <div class="product-info">

                        <div
                        class="product-name"
                        id="productName">

                            LOXICA Product

                        </div>


                        <div>

                            <span
                            class="product-price"
                            id="productPrice">

                                ₹0

                            </span>


                            <span
                            class="original-price"
                            id="originalPrice">

                            </span>

                        </div>

                    </div>

                </div>


                <!-- COLOR DISPLAY -->

                <div
                class="color-box"
                id="colorBox"
                style="display:none;">

                    <strong>
                        Selected Color:
                    </strong>

                    <span
                    id="selectedColor">
                    </span>

                </div>

            </div>



            <!-- =====================================
                 DELIVERY DETAILS
                 ===================================== -->

            <div class="box">


                <div class="box-title">

                    <i class="fa-solid fa-location-dot"></i>

                    Delivery Address

                </div>



                <!-- NAME -->

                <label for="name">

                    Full Name
                    <span class="required">*</span>

                </label>

                <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                autocomplete="name">



                <!-- PHONE -->

                <label for="phone">

                    Phone Number
                    <span class="required">*</span>

                </label>

                <input
                type="tel"
                id="phone"
                placeholder="10 digit mobile number"
                maxlength="10"
                inputmode="numeric"
                pattern="[0-9]*"
                autocomplete="tel">


                <div
                class="error"
                id="phoneError">

                    Please enter a valid 10 digit phone number.

                </div>



                <!-- ADDRESS -->

                <label for="address">

                    Full Address
                    <span class="required">*</span>

                </label>

                <textarea
                id="address"
                placeholder="House name, house number, street etc."
                autocomplete="street-address"></textarea>



                <!-- LANDMARK -->

                <label for="landmark">

                    Landmark

                </label>

                <input
                type="text"
                id="landmark"
                placeholder="Nearby landmark">



                <!-- CITY / STATE -->

                <div class="row">


                    <div>

                        <label for="city">

                            City
                            <span class="required">*</span>

                        </label>

                        <input
                        type="text"
                        id="city"
                        placeholder="City"
                        autocomplete="address-level2">

                    </div>


                    <div>

                        <label for="state">

                            State
                            <span class="required">*</span>

                        </label>

                        <input
                        type="text"
                        id="state"
                        placeholder="State"
                        value="Kerala"
                        autocomplete="address-level1">

                    </div>


                </div>



                <!-- =================================
                     PINCODE
                     ================================= -->

                <label for="pincode">

                    Pincode
                    <span class="required">*</span>

                </label>


                <input
                type="tel"
                id="pincode"
                placeholder="6 digit pincode"
                maxlength="6"
                inputmode="numeric"
                pattern="[0-9]*"
                autocomplete="postal-code">


                <div
                class="error"
                id="pincodeError">

                    Please enter a valid 6 digit pincode.

                </div>



                <!-- COLOR FORM -->

                <div
                class="color-box"
                id="colorFormBox"
                style="display:none;">

                    <label for="color">

                        Selected Color

                    </label>

                    <input
                    type="text"
                    id="color"
                    readonly>

                </div>


            </div>

        </div>



        <!-- =========================================
             RIGHT SIDE
             ========================================= -->

        <div>


            <div class="box">


                <div class="box-title">

                    Order Summary

                </div>


                <div class="summary-row">

                    <span>
                        Product
                    </span>

                    <span id="summaryProduct">
                        -
                    </span>

                </div>


                <div class="summary-row">

                    <span>
                        Price
                    </span>

                    <span>

                        ₹<span id="summaryPrice">
                            0
                        </span>

                    </span>

                </div>


                <div class="summary-row">

                    <span>
                        Delivery
                    </span>

                    <span>
                        FREE
                    </span>

                </div>


                <div class="summary-row summary-total">

                    <span>
                        Total
                    </span>

                    <span>

                        ₹<span id="summaryTotal">
                            0
                        </span>

                    </span>

                </div>


                <br>


                <button
                class="continue-btn"
                id="continueBtn"
                type="button">

                    Continue to Payment

                    <i class="fa-solid fa-arrow-right"></i>

                </button>


                <div class="secure">

                    <i class="fa-solid fa-lock"></i>

                    Secure checkout

                </div>


            </div>


        </div>


    </div>


</div>


<div class="footer">

    © 2026 LOXICA. All rights reserved.

</div>



<script>


/* =========================================================
   GOOGLE APPS SCRIPT
   ========================================================= */

const scriptURL =
"https://script.google.com/macros/s/AKfycbx61ZbcXj5ySQ0ovhGj-SjnKHpav818Gp4-uUcdBTfpsCd2ZU8B5TxuOWLKklvfnLKj/exec";


/* =========================================================
   URL PARAMETERS
   ========================================================= */

const params =
new URLSearchParams(
    window.location.search
);


const product =
params.get("product") ||
"LOXICA Product";


const price =
params.get("price") ||
"0";


const originalPrice =
params.get("originalPrice") ||
price;


const checkoutSession =
params.get("session") ||
"";


const selectedColorFromURL =
(
    params.get("color") ||
    ""
).trim();


/* =========================================================
   MEMBER ID
   ========================================================= */

let memberId =
(
    params.get("memberId") ||
    ""
).trim();


/* =========================================================
   DEBUG
   ========================================================= */

console.log(
    "======================================"
);

console.log(
    "LOXICA CHECKOUT"
);

console.log(
    "Product:",
    product
);

console.log(
    "Price:",
    price
);

console.log(
    "Original Price:",
    originalPrice
);

console.log(
    "Member ID:",
    memberId
);

console.log(
    "Color:",
    selectedColorFromURL
);

console.log(
    "Session:",
    checkoutSession
);

console.log(
    "======================================"
);


/* =========================================================
   SESSION STORAGE
   ========================================================= */

const storageKey =
checkoutSession
    ? "loxicaCheckout_" + checkoutSession
    : null;


/* =========================================================
   ELEMENTS
   ========================================================= */

const productNameElement =
document.getElementById(
    "productName"
);


const productPriceElement =
document.getElementById(
    "productPrice"
);


const originalPriceElement =
document.getElementById(
    "originalPrice"
);


const summaryProductElement =
document.getElementById(
    "summaryProduct"
);


const summaryPriceElement =
document.getElementById(
    "summaryPrice"
);


const summaryTotalElement =
document.getElementById(
    "summaryTotal"
);


const continueBtn =
document.getElementById(
    "continueBtn"
);


const colorBox =
document.getElementById(
    "colorBox"
);


const selectedColorElement =
document.getElementById(
    "selectedColor"
);


const colorFormBox =
document.getElementById(
    "colorFormBox"
);


const colorInput =
document.getElementById(
    "color"
);


/* =========================================================
   DISPLAY PRODUCT
   ========================================================= */

productNameElement.textContent =
product;


summaryProductElement.textContent =
product;


/* =========================================================
   DISPLAY PRICE
   ========================================================= */

const numericPrice =
Number(price) || 0;


const numericOriginalPrice =
Number(originalPrice) ||
numericPrice;


productPriceElement.textContent =
"₹" +
numericPrice.toLocaleString(
    "en-IN"
);


summaryPriceElement.textContent =
numericPrice.toLocaleString(
    "en-IN"
);


summaryTotalElement.textContent =
numericPrice.toLocaleString(
    "en-IN"
);


if(
    numericOriginalPrice >
    numericPrice
){

    originalPriceElement.textContent =
    "₹" +
    numericOriginalPrice.toLocaleString(
        "en-IN"
    );

}
else{

    originalPriceElement.style.display =
    "none";

}


/* =========================================================
   COLOR
   ========================================================= */

if(
    selectedColorFromURL
){

    colorBox.style.display =
    "block";


    selectedColorElement.textContent =
    selectedColorFromURL;


    colorFormBox.style.display =
    "block";


    colorInput.value =
    selectedColorFromURL;

}


/* =========================================================
   RESTORE FORM DATA
   ========================================================= */

function restoreFormData(){

    if(!storageKey){
        return;
    }


    const saved =
    sessionStorage.getItem(
        storageKey
    );


    if(!saved){
        return;
    }


    try{

        const data =
        JSON.parse(saved);


        document.getElementById(
            "name"
        ).value =
        data.name || "";


        document.getElementById(
            "phone"
        ).value =
        data.phone || "";


        document.getElementById(
            "address"
        ).value =
        data.address || "";


        document.getElementById(
            "landmark"
        ).value =
        data.landmark || "";


        document.getElementById(
            "city"
        ).value =
        data.city || "";


        document.getElementById(
            "state"
        ).value =
        data.state ||
        "Kerala";


        document.getElementById(
            "pincode"
        ).value =
        data.pincode || "";


        if(
            data.color &&
            !selectedColorFromURL
        ){

            document.getElementById(
                "color"
            ).value =
            data.color;

        }


        if(
            !memberId &&
            data.memberId
        ){

            memberId =
            String(
                data.memberId
            ).trim();

        }

    }
    catch(error){

        console.error(
            "SESSION RESTORE ERROR:",
            error
        );

    }

}


restoreFormData();


/* =========================================================
   SAVE FORM DATA
   ========================================================= */

function saveFormData(){

    if(!storageKey){
        return;
    }


    const data = {

        name:
        document.getElementById(
            "name"
        ).value,

        phone:
        document.getElementById(
            "phone"
        ).value,

        address:
        document.getElementById(
            "address"
        ).value,

        landmark:
        document.getElementById(
            "landmark"
        ).value,

        city:
        document.getElementById(
            "city"
        ).value,

        state:
        document.getElementById(
            "state"
        ).value,

        pincode:
        document.getElementById(
            "pincode"
        ).value,

        color:
        document.getElementById(
            "color"
        ).value,

        memberId:
        memberId

    };


    sessionStorage.setItem(
        storageKey,
        JSON.stringify(data)
    );

}


/* =========================================================
   PHONE NUMBER INPUT
   ========================================================= */

document
.getElementById("phone")
.addEventListener(
    "input",
    function(){

        this.value =
        this.value
        .replace(/\D/g,"")
        .slice(0,10);

    }
);


/* =========================================================
   PINCODE INPUT
   ========================================================= */

document
.getElementById("pincode")
.addEventListener(
    "input",
    function(){

        this.value =
        this.value
        .replace(/\D/g,"")
        .slice(0,6);

    }
);


/* =========================================================
   SAVE WHILE TYPING
   ========================================================= */

[
    "name",
    "phone",
    "address",
    "landmark",
    "city",
    "state",
    "pincode",
    "color"

].forEach(
    function(id){

        const element =
        document.getElementById(id);


        if(element){

            element.addEventListener(
                "input",
                saveFormData
            );

        }

    }
);


/* =========================================================
   ERROR HELPERS
   ========================================================= */

function hideErrors(){

    document.getElementById(
        "phoneError"
    ).style.display =
    "none";


    document.getElementById(
        "pincodeError"
    ).style.display =
    "none";

}


/* =========================================================
   RESET BUTTON
   ========================================================= */

function resetButton(){

    continueBtn.disabled =
    false;


    continueBtn.innerHTML =
    'Continue to Payment <i class="fa-solid fa-arrow-right"></i>';

}


/* =========================================================
   CONTINUE TO PAYMENT
   ========================================================= */

continueBtn.addEventListener(
    "click",
    async function(){

        hideErrors();


        continueBtn.disabled =
        true;


        continueBtn.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';


        /* =================================================
           FORM VALUES
           ================================================= */

        const nameValue =
        document
        .getElementById("name")
        .value
        .trim();


        const phoneValue =
        document
        .getElementById("phone")
        .value
        .replace(/\D/g,"")
        .trim();


        const addressValue =
        document
        .getElementById("address")
        .value
        .trim();


        const landmarkValue =
        document
        .getElementById("landmark")
        .value
        .trim();


        const cityValue =
        document
        .getElementById("city")
        .value
        .trim();


        const stateValue =
        document
        .getElementById("state")
        .value
        .trim();


        const pincodeValue =
        document
        .getElementById("pincode")
        .value
        .replace(/\D/g,"")
        .trim();


        let colorValue =
        document
        .getElementById("color")
        .value
        .trim();


        if(
            selectedColorFromURL
        ){

            colorValue =
            selectedColorFromURL;

        }


        /* =================================================
           VALIDATION
           ================================================= */

        if(!nameValue){

            alert(
                "Please enter your full name."
            );

            resetButton();

            return;

        }


        if(
            phoneValue.length !== 10
        ){

            document.getElementById(
                "phoneError"
            ).style.display =
            "block";


            document.getElementById(
                "phone"
            ).focus();


            resetButton();

            return;

        }


        if(!addressValue){

            alert(
                "Please enter your delivery address."
            );

            resetButton();

            return;

        }


        if(!cityValue){

            alert(
                "Please enter your city."
            );

            resetButton();

            return;

        }


        if(!stateValue){

            alert(
                "Please enter your state."
            );

            resetButton();

            return;

        }


        /* =================================================
           PINCODE VALIDATION
           ================================================= */

        if(
            pincodeValue.length !== 6
        ){

            document.getElementById(
                "pincodeError"
            ).style.display =
            "block";


            document.getElementById(
                "pincode"
            ).focus();


            resetButton();

            return;

        }


        /* =================================================
           MEMBER ID CHECK
           ================================================= */

        if(!memberId){

            alert(
                "Customer account information is missing. Please go back and try again."
            );


            resetButton();

            return;

        }


        /* =================================================
           FINAL ORDER DATA
           ================================================= */

        const currentData = {

            /* PRODUCT */

            product:
            product,

            price:
            price,

            originalPrice:
            originalPrice,


            /* CUSTOMER */

            name:
            nameValue,

            phone:
            "+91" +
            phoneValue,

            address:
            addressValue,

            landmark:
            landmarkValue,

            city:
            cityValue,

            state:
            stateValue,

            pincode:
            pincodeValue,

            color:
            colorValue,


            /* MEMBER */

            memberId:
            String(
                memberId
            ).trim()

        };


        /* =================================================
           SAVE FORM
           ================================================= */

        saveFormData();


        /* =================================================
           DEBUG
           ================================================= */

        console.log(
            "======================================"
        );

        console.log(
            "LOXICA FINAL ORDER DATA"
        );

        console.log(
            "Product:",
            currentData.product
        );

        console.log(
            "Price:",
            currentData.price
        );

        console.log(
            "Name:",
            currentData.name
        );

        console.log(
            "Phone:",
            currentData.phone
        );

        console.log(
            "Pincode:",
            currentData.pincode
        );

        console.log(
            "Member ID:",
            currentData.memberId
        );

        console.log(
            "======================================"
        );


        /* =================================================
           SEND TO GOOGLE APPS SCRIPT
           ================================================= */

        try{

            const response =
            await fetch(
                scriptURL,
                {

                    method:
                    "POST",

                    headers:{
                        "Content-Type":
                        "text/plain;charset=utf-8"
                    },

                    body:
                    JSON.stringify(
                        currentData
                    )

                }
            );


            const result =
            await response.json();


            console.log(
                "GOOGLE SCRIPT RESPONSE:",
                result
            );


            /* =================================================
               CHECK SUCCESS
               ================================================= */

            if(
                !result ||
                !result.success
            ){

                throw new Error(
                    result?.error ||
                    "Order could not be saved."
                );

            }


            /* =================================================
               ORDER ID
               ================================================= */

            const orderId =
            result.orderId || "";


            if(!orderId){

                throw new Error(
                    "Order ID was not received."
                );

            }


            /* =================================================
               SAVE ORDER ID
               ================================================= */

            if(storageKey){

                let sessionData = {};


                const saved =
                sessionStorage.getItem(
                    storageKey
                );


                if(saved){

                    try{

                        sessionData =
                        JSON.parse(saved);

                    }
                    catch(error){

                        sessionData = {};

                    }

                }


                sessionData.orderId =
                orderId;


                sessionData.memberId =
                memberId;


                sessionStorage.setItem(
                    storageKey,
                    JSON.stringify(
                        sessionData
                    )
                );

            }


            /* =================================================
               PAYMENT PAGE
               ================================================= */

            let paymentURL =
            "payment.html" +

            "?product=" +
            encodeURIComponent(
                product
            ) +

            "&price=" +
            encodeURIComponent(
                price
            ) +

            "&originalPrice=" +
            encodeURIComponent(
                originalPrice
            ) +

            "&orderId=" +
            encodeURIComponent(
                orderId
            );


            /* SESSION */

            if(
                checkoutSession
            ){

                paymentURL +=
                "&session=" +
                encodeURIComponent(
                    checkoutSession
                );

            }


            /* COLOR */

            if(
                colorValue
            ){

                paymentURL +=
                "&color=" +
                encodeURIComponent(
                    colorValue
                );

            }


            /* MEMBER ID */

            if(
                memberId
            ){

                paymentURL +=
                "&memberId=" +
                encodeURIComponent(
                    memberId
                );

            }


            console.log(
                "PAYMENT PAGE URL:",
                paymentURL
            );


            /* =================================================
               OPEN PAYMENT PAGE
               ================================================= */

            window.location.href =
            paymentURL;


        }
        catch(error){

            console.error(
                "CHECKOUT ERROR:",
                error
            );


            alert(
                "Something went wrong while creating your order.\n\n" +
                (
                    error.message ||
                    "Please try again."
                )
            );


            resetButton();

        }

    }
);

</script>

</body>
</html>
