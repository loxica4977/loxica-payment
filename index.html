<!DOCTYPE html>

<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LOXICA Checkout</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f3f3f3;
    color:#111;
}

.header{
    background:#111;
    color:#fff;
    height:65px;
    display:flex;
    align-items:center;
    padding:0 6%;
}

.logo{
    font-size:27px;
    font-weight:800;
    letter-spacing:2px;
}

.logo span{
    color:#19d66b;
}

.container{
    max-width:1100px;
    margin:25px auto;
    padding:0 15px;
}

.checkout-title{
    font-size:28px;
    font-weight:700;
    margin-bottom:20px;
}

.checkout-grid{
    display:grid;
    grid-template-columns:1fr 360px;
    gap:20px;
}

.box{
    background:#fff;
    border-radius:8px;
    padding:22px;
    margin-bottom:18px;
    box-shadow:0 1px 4px rgba(0,0,0,.08);
}

.box-title{
    font-size:20px;
    font-weight:700;
    margin-bottom:18px;
}

label{
    display:block;
    font-size:14px;
    font-weight:600;
    margin-bottom:7px;
}

input,
textarea,
select{
    width:100%;
    border:1px solid #bbb;
    border-radius:5px;
    padding:12px;
    font-size:15px;
    outline:none;
    margin-bottom:15px;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#111;
}

textarea{
    min-height:90px;
    resize:vertical;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.product-box{
    display:flex;
    align-items:center;
    gap:15px;
}

.product-info{
    flex:1;
}

.product-name{
    font-size:18px;
    font-weight:700;
    margin-bottom:8px;
}

.product-price{
    font-size:23px;
    font-weight:800;
}

.original-price{
    color:#777;
    text-decoration:line-through;
    margin-left:8px;
    font-size:15px;
}

.color-box{
    background:#f7f7f7;
    border:1px solid #ddd;
    border-radius:5px;
    padding:12px;
    margin-top:5px;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    margin-bottom:14px;
    font-size:15px;
}

.summary-total{
    border-top:1px solid #ddd;
    padding-top:16px;
    margin-top:8px;
    font-size:21px;
    font-weight:800;
}

.continue-btn{
    width:100%;
    background:#19d66b;
    border:none;
    border-radius:6px;
    padding:15px;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}

.continue-btn:hover{
    background:#12bd5b;
}

.continue-btn:disabled{
    background:#999;
    cursor:not-allowed;
}

.secure{
    text-align:center;
    color:#555;
    font-size:13px;
    margin-top:15px;
}

.secure i{
    color:#19a95a;
    margin-right:5px;
}

.footer{
    text-align:center;
    color:#777;
    font-size:13px;
    padding:20px;
}

.error{
    color:#d00;
    font-size:13px;
    margin-top:-8px;
    margin-bottom:12px;
    display:none;
}

@media(max-width:800px){

    .checkout-grid{
        grid-template-columns:1fr;
    }

    .row{
        grid-template-columns:1fr;
        gap:0;
    }

    .header{
        padding:0 20px;
    }

    .container{
        margin-top:18px;
    }

    .checkout-title{
        font-size:24px;
    }

}

</style>

</head>

<body>

<header class="header">

```
<div class="logo">
    LOXI<span>CA</span>
</div>
```

</header>

<div class="container">

```
<div class="checkout-title">
    Checkout
</div>


<div class="checkout-grid">

    <!-- LEFT SIDE -->

    <div>

        <!-- PRODUCT -->

        <div class="box">

            <div class="box-title">
                <i class="fa-solid fa-box"></i>

                    ₹<span id="summaryPrice">0</span>

                <span>
                    Total
                </span>

                <span>
                    ₹<span id="summaryTotal">0</span>

            </div>


            <br>


            <button

<script>

/* =========================================================
   LOXICA CHECKOUT
   ========================================================= */


/* =========================================================
   GOOGLE APPS SCRIPT
   ========================================================= */

const scriptURL =
"https://script.google.com/macros/s/AKfycbx61ZbcXj5ySQ0ovhGj-SjnKHpav818Gp4-uUcdBTfpsCd2ZU8B5TxuOWLKklvfnLKj/exec";


/* =========================================================
   URL PARAMETERS
   ========================================================= */

const params =
new URLSearchParams(
    window.location.search
);


const product =
params.get("product") ||
"LOXICA Product";


const price =
params.get("price") ||
"0";


const originalPrice =
params.get("originalPrice") ||
price;


const checkoutSession =
params.get("session") ||
"";


const selectedColorFromURL =
(
    params.get("color") ||
    ""
).trim();


/* =========================================================
   WIX DATA
   ========================================================= */

let memberId =
(
    params.get("memberId") ||
    ""
).trim();


let wixOrderId =
(
    params.get("wixOrderId") ||
    ""
).trim();


let orderNumber =
(
    params.get("orderNumber") ||
    ""
).trim();


/* =========================================================
   DEBUG URL DATA
   ========================================================= */

console.log(
    "======================================"
);

console.log(
    "LOXICA WIX DATA FROM URL"
);

console.log(
    "Member ID:",
    memberId
);

console.log(
    "Wix Order ID:",
    wixOrderId
);

console.log(
    "Order Number:",
    orderNumber
);

console.log(
    "Product:",
    product
);

console.log(
    "Price:",
    price
);

console.log(
    "Session:",
    checkoutSession
);

console.log(
    "======================================"
);


/* =========================================================
   SESSION STORAGE KEY
   ========================================================= */

const storageKey =
checkoutSession
    ? "loxicaCheckout_" + checkoutSession
    : null;


/* =========================================================
   ELEMENTS
   ========================================================= */

const productNameElement =
document.getElementById(
    "productName"
);


const productPriceElement =
document.getElementById(
    "productPrice"
);


const originalPriceElement =
document.getElementById(
    "originalPrice"
);


const summaryProductElement =
document.getElementById(
    "summaryProduct"
);


const summaryPriceElement =
document.getElementById(
    "summaryPrice"
);


const summaryTotalElement =
document.getElementById(
    "summaryTotal"
);


const continueBtn =
document.getElementById(
    "continueBtn"
);


const colorBox =
document.getElementById(
    "colorBox"
);


const selectedColorElement =
document.getElementById(
    "selectedColor"
);


const colorFormBox =
document.getElementById(
    "colorFormBox"
);


const colorInput =
document.getElementById(
    "color"
);


/* =========================================================
   DISPLAY PRODUCT
   ========================================================= */

productNameElement.textContent =
product;


summaryProductElement.textContent =
product;


/* =========================================================
   DISPLAY PRICE
   ========================================================= */

const numericPrice =
Number(price) || 0;


const numericOriginalPrice =
Number(originalPrice) ||
numericPrice;


productPriceElement.textContent =
"₹" +
numericPrice.toLocaleString(
    "en-IN"
);


summaryPriceElement.textContent =
numericPrice.toLocaleString(
    "en-IN"
);


summaryTotalElement.textContent =
numericPrice.toLocaleString(
    "en-IN"
);


if(
    numericOriginalPrice >
    numericPrice
){

    originalPriceElement.textContent =
    "₹" +
    numericOriginalPrice.toLocaleString(
        "en-IN"
    );

}
else{

    originalPriceElement.style.display =
    "none";

}


/* =========================================================
   COLOR
   ========================================================= */

if(selectedColorFromURL){

    colorBox.style.display =
    "block";

    selectedColorElement.textContent =
    selectedColorFromURL;

    colorFormBox.style.display =
    "block";

    colorInput.value =
    selectedColorFromURL;

}


/* =========================================================
   SAVE FORM DATA
   ========================================================= */

function saveFormData(){

    if(!storageKey){
        return;
    }


    const data = {

        name:
        document.getElementById(
            "name"
        ).value,

        phone:
        document.getElementById(
            "phone"
        ).value,

        address:
        document.getElementById(
            "address"
        ).value,

        landmark:
        document.getElementById(
            "landmark"
        ).value,

        city:
        document.getElementById(
            "city"
        ).value,

        state:
        document.getElementById(
            "state"
        ).value,

        pincode:
        document.getElementById(
            "pincode"
        ).value,

        color:
        document.getElementById(
            "color"
        ).value,

        /* WIX DATA */

        memberId:
        memberId,

        wixOrderId:
        wixOrderId,

        orderNumber:
        orderNumber

    };


    sessionStorage.setItem(
        storageKey,
        JSON.stringify(data)
    );

}


/* =========================================================
   RESTORE FORM DATA
   ========================================================= */

function restoreFormData(){

    if(!storageKey){
        return;
    }


    const saved =
    sessionStorage.getItem(
        storageKey
    );


    if(!saved){
        return;
    }


    try{

        const data =
        JSON.parse(saved);


        document.getElementById(
            "name"
        ).value =
        data.name || "";


        document.getElementById(
            "phone"
        ).value =
        data.phone || "";


        document.getElementById(
            "address"
        ).value =
        data.address || "";


        document.getElementById(
            "landmark"
        ).value =
        data.landmark || "";


        document.getElementById(
            "city"
        ).value =
        data.city || "";


        document.getElementById(
            "state"
        ).value =
        data.state ||
        "Kerala";


        document.getElementById(
            "pincode"
        ).value =
        data.pincode || "";


        if(
            data.color &&
            !selectedColorFromURL
        ){

            document.getElementById(
                "color"
            ).value =
            data.color;

        }


        /*
         ==============================================
         RESTORE WIX DATA ONLY IF URL IS EMPTY
         ==============================================
        */

        if(
            !memberId &&
            data.memberId
        ){

            memberId =
            String(
                data.memberId
            ).trim();

        }


        if(
            !wixOrderId &&
            data.wixOrderId
        ){

            wixOrderId =
            String(
                data.wixOrderId
            ).trim();

        }


        if(
            !orderNumber &&
            data.orderNumber
        ){

            orderNumber =
            String(
                data.orderNumber
            ).trim();

        }


    }
    catch(error){

        console.error(
            "SESSION RESTORE ERROR:",
            error
        );

    }

}


/* Restore saved data */

restoreFormData();


/* =========================================================
   INPUT CLEANING
   ========================================================= */

document
.getElementById("phone")
.addEventListener(
    "input",
    function(){

        this.value =
        this.value
        .replace(/\D/g,"")
        .slice(0,10);

    }
);


document
.getElementById("pincode")
.addEventListener(
    "input",
    function(){

        this.value =
        this.value
        .replace(/\D/g,"")
        .slice(0,6);

    }
);


/* =========================================================
   SAVE WHILE TYPING
   ========================================================= */

[
    "name",
    "phone",
    "address",
    "landmark",
    "city",
    "state",
    "pincode",
    "color"

].forEach(
    function(id){

        const element =
        document.getElementById(id);


        if(element){

            element.addEventListener(
                "input",
                saveFormData
            );

        }

    }
);


/* =========================================================
   ERROR HELPERS
   ========================================================= */

function hideErrors(){

    document.getElementById(
        "phoneError"
    ).style.display =
    "none";


    document.getElementById(
        "pincodeError"
    ).style.display =
    "none";

}


/* =========================================================
   CONTINUE TO PAYMENT
   ========================================================= */

continueBtn.addEventListener(
    "click",
    async function(){

        hideErrors();


        /* Disable button */

        continueBtn.disabled =
        true;


        continueBtn.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';


        /* =================================================
           FORM VALUES
           ================================================= */

        const nameValue =
        document
        .getElementById("name")
        .value
        .trim();


        let phoneValue =
        document
        .getElementById("phone")
        .value
        .replace(/\D/g,"")
        .trim();


        const addressValue =
        document
        .getElementById("address")
        .value
        .trim();


        const landmarkValue =
        document
        .getElementById("landmark")
        .value
        .trim();


        const cityValue =
        document
        .getElementById("city")
        .value
        .trim();


        const stateValue =
        document
        .getElementById("state")
        .value
        .trim();


        const pincodeValue =
        document
        .getElementById("pincode")
        .value
        .replace(/\D/g,"")
        .trim();


        let colorValue =
        document
        .getElementById("color")
        .value
        .trim();


        /* =================================================
           COLOR FROM URL HAS PRIORITY
           ================================================= */

        if(
            selectedColorFromURL
        ){

            colorValue =
            selectedColorFromURL;

        }


        /* =================================================
           VALIDATION
           ================================================= */

        if(!nameValue){

            alert(
                "Please enter your full name."
            );


            continueBtn.disabled =
            false;


            continueBtn.innerHTML =
            'Continue to Payment <i class="fa-solid fa-arrow-right"></i>';


            return;

        }


        if(
            phoneValue.length !== 10
        ){

            document.getElementById(
                "phoneError"
            ).style.display =
            "block";


            document
            .getElementById("phone")
            .focus();


            continueBtn.disabled =
            false;


            continueBtn.innerHTML =
            'Continue to Payment <i class="fa-solid fa-arrow-right"></i>';


            return;

        }


        if(!addressValue){

            alert(
                "Please enter your delivery address."
            );


            continueBtn.disabled =
            false;


            continueBtn.innerHTML =
            'Continue to Payment <i class="fa-solid fa-arrow-right"></i>';


            return;

        }


        if(!cityValue){

            alert(
                "Please enter your city."
            );


            continueBtn.disabled =
            false;


            continueBtn.innerHTML =
            'Continue to Payment <i class="fa-solid fa-arrow-right"></i>';


            return;

        }


        if(!stateValue){

            alert(
                "Please enter your state."
            );


            continueBtn.disabled =
            false;


            continueBtn.innerHTML =
            'Continue to Payment <i class="fa-solid fa-arrow-right"></i>';


            return;

        }


        if(
            pincodeValue.length !== 6
        ){

            document.getElementById(
                "pincodeError"
            ).style.display =
            "block";


            document
            .getElementById("pincode")
            .focus();


            continueBtn.disabled =
            false;


            continueBtn.innerHTML =
            'Continue to Payment <i class="fa-solid fa-arrow-right"></i>';


            return;

        }


        /* =================================================
           FINAL ORDER DATA
           ================================================= */

        const currentData = {

            /* PRODUCT */

            product:
            product,

            price:
            price,

            originalPrice:
            originalPrice,


            /* CUSTOMER */

            name:
            nameValue,

            phone:
            "+91" +
            phoneValue,

            address:
            addressValue,

            landmark:
            landmarkValue,

            city:
            cityValue,

            state:
            stateValue,

            pincode:
            pincodeValue,

            color:
            colorValue,


            /* =================================================
               WIX MEMBER / ORDER INFORMATION
               ================================================= */

            memberId:
            String(
                memberId || ""
            ).trim(),

            wixOrderId:
            String(
                wixOrderId || ""
            ).trim(),

            orderNumber:
            String(
                orderNumber || ""
            ).trim()

        };


        /* =================================================
           EXISTING SESSION ORDER ID
           ================================================= */

        if(storageKey){

            const savedOrder =
            sessionStorage.getItem(
                storageKey
            );


            if(savedOrder){

                try{

                    const parsed =
                    JSON.parse(
                        savedOrder
                    );


                    if(
                        parsed.orderId
                    ){

                        currentData.orderId =
                        parsed.orderId;

                    }

                }
                catch(error){

                    console.error(
                        "ORDER SESSION ERROR:",
                        error
                    );

                }

            }

        }


        /* =================================================
           SAVE CURRENT DATA
           ================================================= */

        saveFormData();


        /* =================================================
           DEBUG BEFORE GOOGLE SCRIPT
           ================================================= */

        console.log(
            "======================================"
        );

        console.log(
            "LOXICA FINAL ORDER DATA"
        );

        console.log(
            "Product:",
            currentData.product
        );

        console.log(
            "Price:",
            currentData.price
        );

        console.log(
            "Member ID:",
            currentData.memberId
        );

        console.log(
            "Wix Order ID:",
            currentData.wixOrderId
        );

        console.log(
            "Order Number:",
            currentData.orderNumber
        );

        console.log(
            "Existing Order ID:",
            currentData.orderId || ""
        );

        console.log(
            "======================================"
        );


        /* =================================================
           SEND TO GOOGLE APPS SCRIPT
           ================================================= */

        try{

            const response =
            await fetch(
                scriptURL,
                {

                    method:
                    "POST",

                    headers:{
                        "Content-Type":
                        "text/plain;charset=utf-8"
                    },

                    body:
                    JSON.stringify(
                        currentData
                    )

                }
            );


            const result =
            await response.json();


            /* =================================================
               GOOGLE RESPONSE
               ================================================= */

            console.log(
                "======================================"
            );

            console.log(
                "GOOGLE SCRIPT RESPONSE:",
                result
            );

            console.log(
                "======================================"
            );


            /* =================================================
               CHECK SUCCESS
               ================================================= */

            if(
                !result ||
                !result.success
            ){

                throw new Error(
                    result?.error ||
                    "Order could not be saved."
                );

            }


            /* =================================================
               GET GOOGLE ORDER ID
               ================================================= */

            const orderId =
            result.orderId || "";


            /* =================================================
               IF SCRIPT RETURNS WIX DATA,
               KEEP THEM
               ================================================= */

            if(
                result.memberId
            ){

                memberId =
                String(
                    result.memberId
                ).trim();

            }


            if(
                result.wixOrderId
            ){

                wixOrderId =
                String(
                    result.wixOrderId
                ).trim();

            }


            if(
                result.orderNumber
            ){

                orderNumber =
                String(
                    result.orderNumber
                ).trim();

            }


            /* =================================================
               SAVE EVERYTHING TO SESSION
               ================================================= */

            if(storageKey){

                let sessionData = {};


                const saved =
                sessionStorage.getItem(
                    storageKey
                );


                if(saved){

                    try{

                        sessionData =
                        JSON.parse(
                            saved
                        );

                    }
                    catch(error){

                        sessionData = {};

                    }

                }


                sessionData.orderId =
                orderId;


                sessionData.memberId =
                memberId;


                sessionData.wixOrderId =
                wixOrderId;


                sessionData.orderNumber =
                orderNumber;


                sessionStorage.setItem(
                    storageKey,
                    JSON.stringify(
                        sessionData
                    )
                );

            }


            /* =================================================
               DEBUG AFTER GOOGLE SAVE
               ================================================= */

            console.log(
                "======================================"
            );

            console.log(
                "FINAL SAVED VALUES"
            );

            console.log(
                "Google Order ID:",
                orderId
            );

            console.log(
                "Member ID:",
                memberId
            );

            console.log(
                "Wix Order ID:",
                wixOrderId
            );

            console.log(
                "Order Number:",
                orderNumber
            );

            console.log(
                "======================================"
            );


            /* =================================================
               PAYMENT PAGE URL
               ================================================= */

            let paymentURL =
            "payment.html" +

            "?product=" +
            encodeURIComponent(
                product
            ) +

            "&price=" +
            encodeURIComponent(
                price
            ) +

            "&originalPrice=" +
            encodeURIComponent(
                originalPrice
            ) +

            "&orderId=" +
            encodeURIComponent(
                orderId
            );


            /* =================================================
               SESSION
               ================================================= */

            if(
                checkoutSession
            ){

                paymentURL +=
                "&session=" +
                encodeURIComponent(
                    checkoutSession
                );

            }


            /* =================================================
               COLOR
               ================================================= */

            if(
                colorValue
            ){

                paymentURL +=
                "&color=" +
                encodeURIComponent(
                    colorValue
                );

            }


            /* =================================================
               MEMBER ID
               ================================================= */

            if(
                memberId
            ){

                paymentURL +=
                "&memberId=" +
                encodeURIComponent(
                    memberId
                );

            }


            /* =================================================
               WIX ORDER ID
               ================================================= */

            if(
                wixOrderId
            ){

                paymentURL +=
                "&wixOrderId=" +
                encodeURIComponent(
                    wixOrderId
                );

            }


            /* =================================================
               ORDER NUMBER
               ================================================= */

            if(
                orderNumber
            ){

                paymentURL +=
                "&orderNumber=" +
                encodeURIComponent(
                    orderNumber
                );

            }


            /* =================================================
               FINAL PAYMENT URL DEBUG
               ================================================= */

            console.log(
                "======================================"
            );

            console.log(
                "PAYMENT PAGE URL:"
            );

            console.log(
                paymentURL
            );

            console.log(
                "======================================"
            );


            /* =================================================
               REDIRECT
               ================================================= */

            window.location.href =
            paymentURL;

        }


        catch(error){

            console.error(
                "CHECKOUT ERROR:",
                error
            );


            alert(
                "Something went wrong while creating your order.\n\n" +
                (
                    error.message ||
                    "Please try again."
                )
            );


            continueBtn.disabled =
            false;


            continueBtn.innerHTML =
            'Continue to Payment <i class="fa-solid fa-arrow-right"></i>';

        }

    }
);

</script>

</body>
</html>
